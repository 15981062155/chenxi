<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 姓名：陈曦，日期：2026-11-04，功能：fetch 获取单个商品详情展示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 商品详情 - 陈曦</title>
    <style>
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 30px 20px;
            background: #f0f2f5;
            min-height: 100vh;
        }

        .cx_back {
            display: inline-block;
            margin-bottom: 16px;
            color: #1e4b3b;
            text-decoration: none;
            font-size: 14px;
        }
        .cx_back:hover { text-decoration: underline; }

        .cx_container {
            max-width: 820px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
        }

        .cx_main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 24px;
        }

        @media (max-width: 640px) {
            .cx_main { grid-template-columns: 1fr; }
        }

        .cx_images {
            background: #fafafa;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .cx_main-img img {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
        }

        .cx_thumbs {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cx_thumbs img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .cx_thumbs img:hover, .cx_thumbs img.active {
            border-color: #1e4b3b;
        }

        .cx_info h1 {
            margin: 0 0 8px;
            font-size: 22px;
            color: #222;
        }

        .cx_cat-tag {
            display: inline-block;
            padding: 3px 10px;
            font-size: 12px;
            color: #1e4b3b;
            background: #eef5f2;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .cx_desc {
            color: #555;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .cx_price-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
        }

        .cx_price { font-size: 28px; font-weight: bold; color: #e74c3c; }
        .cx_price::before { content: "$"; font-size: 18px; }
        .cx_discount {
            background: #ffe9e9;
            color: #e74c3c;
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .cx_stock {
            font-size: 13px;
            padding: 3px 10px;
            border-radius: 4px;
        }
        .cx_stock.in { background: #e6f7ed; color: #1e7a3c; }
        .cx_stock.out { background: #fdecea; color: #c0392b; }

        .cx_rating-box {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }
        .cx_stars { color: #f39c12; font-size: 18px; margin-right: 6px; }

        .cx_meta-row {
            font-size: 13px;
            color: #888;
            margin: 6px 0;
        }
        .cx_meta-row b { color: #444; }

        .cx_loading, .cx_err {
            max-width: 400px;
            margin: 80px auto;
            text-align: center;
            color: #888;
        }
        .cx_err { color: #c0392b; }
    </style>
</head>
<body>
    <div style="max-width: 820px; margin: 0 auto;"><a class="cx_back" href="17-3.html">← 返回列表</a></div>

    <div id="cx_box" class="cx_container">
        <div class="cx_loading" style="padding: 60px;">⏳ 加载中…</div>
    </div>

    <script>
        function cx_getId() {
            var params = new URLSearchParams(location.search);
            return params.get('id') || '1';
        }

        async function cx_loadDetail() {
            var id = cx_getId();
            var box = document.getElementById('cx_box');
            try {
                var res = await fetch('https://dummyjson.com/products/' + id);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var p = await res.json();
                cx_render(p);
            } catch (e) {
                box.innerHTML = '<div class="cx_err" style="padding: 60px;">✗ 加载失败：' + e.message + '</div>';
            }
        }

        function cx_render(p) {
            var imgs = p.images && p.images.length ? p.images : [p.thumbnail || ''];
            var stockClass = p.stock > 0 ? 'in' : 'out';
            var stockText = p.stock > 0 ? ('库存 ' + p.stock) : '缺货';

            var thumbsHtml = '';
            imgs.forEach(function (src, i) {
                thumbsHtml += '<img src="' + src + '" class="' + (i === 0 ? 'active' : '') + '" onclick="cx_switchImg(this, \'' + src.replace(/'/g, "\\'") + '\')">';
            });

            var stars = '';
            var fullStars = Math.round(p.rating || 0);
            for (var i = 0; i < 5; i++) {
                stars += i < fullStars ? '★' : '☆';
            }

            box.innerHTML =
                '<div class="cx_main">'
                + '<div class="cx_images">'
                + '<div class="cx_main-img"><img id="cx_mainImg" src="' + imgs[0] + '" alt=""></div>'
                + '<div class="cx_thumbs">' + thumbsHtml + '</div>'
                + '</div>'
                + '<div class="cx_info">'
                + '<span class="cx_cat-tag">' + (p.category || '') + '</span>'
                + '<h1>' + p.title + '</h1>'
                + '<div class="cx_desc">' + p.description + '</div>'
                + '<div class="cx_price-row">'
                + '<span class="cx_price">' + p.price + '</span>'
                + (p.discountPercentage ? '<span class="cx_discount">-' + p.discountPercentage + '%</span>' : '')
                + '<span class="cx_stock ' + stockClass + '">' + stockText + '</span>'
                + '</div>'
                + '<div class="cx_rating-box"><span class="cx_stars">' + stars + '</span>' + (p.rating || '0.0') + ' / 5</div>'
                + '<div class="cx_meta-row"><b>品牌：</b>' + (p.brand || '—') + '</div>'
                + '<div class="cx_meta-row"><b>ID：</b>' + p.id + '</div>'
                + '</div></div>';
        }

        function cx_switchImg(thumb, src) {
            document.getElementById('cx_mainImg').src = src;
            var siblings = thumb.parentNode.querySelectorAll('img');
            siblings.forEach(function (s) { s.classList.remove('active'); });
            thumb.classList.add('active');
        }

        cx_loadDetail();
    </script>
</body>
</html>
