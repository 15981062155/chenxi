<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10.3 视口响应</title>
  <style>
    :root {
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffb703 0%, #ff6b35 35%, #f72585 100%);
      transition: background 0.8s ease;
      padding: 1rem;
    }

    .full-box {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border-radius: 1.5rem;
    }

    .full-box::before,
    .full-box::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(2.5rem);
      opacity: 0.42;
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    .full-box::before {
      width: 30rem;
      height: 30rem;
      background: rgba(255, 255, 255, 0.28);
      top: -9rem;
      right: -5rem;
    }

    .full-box::after {
      width: 24rem;
      height: 24rem;
      background: rgba(13, 22, 41, 0.22);
      left: -5rem;
      bottom: -6rem;
      animation-delay: 2s;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #fff;
      text-shadow: 0 0.35rem 1.4rem rgba(0, 0, 0, 0.38);
      padding: 2.5rem 3rem;
      border: 0.0625rem solid rgba(255, 255, 255, 0.2);
      background: rgba(11, 11, 11, 0.18);
      border-radius: 1.8rem;
      box-shadow:
        0 2rem 4rem rgba(0, 0, 0, 0.24),
        inset 0 0 0 0.0625rem rgba(255,255,255,0.1);
      backdrop-filter: blur(6px);
      transition: all 0.4s ease;
    }

    .content h1 {
      margin: 0;
      font-size: clamp(3.5rem, 9vw, 10rem);
      line-height: 0.95;
      letter-spacing: 0.22rem;
      font-weight: 900;
    }

    .content p {
      margin: 1.2rem 0 0;
      font-size: clamp(1.1rem, 2.8vw, 2.6rem);
      letter-spacing: 0.28rem;
      opacity: 0.96;
      font-weight: 600;
    }

    @keyframes floatGlow {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(-1rem, 1.2rem) scale(1.08);
      }
    }

    @media (max-width: 900px) {
      body {
        background: linear-gradient(135deg, #fb8500 0%, #f77f00 100%);
      }

      .full-box {
        padding: 1.5rem;
      }

      .content {
        padding: 1.8rem 2.2rem;
      }

      .content h1 {
        font-size: clamp(2.7rem, 8vw, 6rem);
      }

      .content p {
        font-size: clamp(1rem, 2.6vw, 1.8rem);
      }
    }

    @media (max-width: 600px) {
      body {
        background: linear-gradient(135deg, #023047 0%, #0f172a 100%);
        padding: 0.75rem;
      }

      .full-box {
        border-radius: 1rem;
      }

      .content {
        padding: 1.3rem 1.5rem;
      }

      .content h1 {
        font-size: clamp(2rem, 12vw, 3.4rem);
        letter-spacing: 0.12rem;
      }

      .content p {
        font-size: clamp(0.8rem, 4vw, 1.2rem);
        letter-spacing: 0.1rem;
      }
    }

    @media (max-width: 420px) {
      body {
        background: linear-gradient(135deg, #1d3557 0%, #0b132b 100%);
      }

      .content {
        padding: 1rem 1.1rem;
      }

      .content h1 {
        font-size: 2.2rem;
      }

      .content p {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="full-box">
    <div class="content">
      <h1>陈曦</h1>
      <p>RESPONSIVE DESIGN</p>
    </div>
  </div>
</body>
</html>
