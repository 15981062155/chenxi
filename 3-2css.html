<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>121 陈曦</title>
     <style>
        h3{
            color: red;
        }
        p{
            color: blue;
        }
        #box{
            width: 500px;
            height: 500px;
            background-color: #ccc;
        }
        /* 扩展1 h2黑底白字 */
        h2{
            background-color: black;
            color: white;
        }
        /* 扩展2 名字每个字不同颜色 */
        .n1{
            color: orange;
        }
        .n2{
            color: green;
        }
        .n3{
            color: hotpink;
        }
        /* 扩展3 “选择器”文字白色 */
        .word-white{
            color:white;
        }
        /* 扩展4 新盒子，学号盒子 */
        #stu-box{
            width:300px;
            height:120px;
            background-color:#87ceeb;
        }
    </style>
</head>
<body>
    <h2>层叠样式表CSS</h2>
    <div id="box">
        <h3><span class="word-white">选择器</span></h3>
        <p><span class="n1">陈</span><span class="n2">曦</span></p>
        <p>CSS属性</p>
    </div>
    <!-- 扩展4 新增学号盒子，把里面数字替换成你的学号 -->
    <div id="stu-box">
        <p>学号：24001010121</p>
           
    
</head>
<body>
       <h2>层叠样式表CSS</h2>
    <div id="box">
        <h3>CSS选择器</h3>
        <p>陈曦</p>
        <p>CSS属性</p>
    </div>
</body>
</html>
