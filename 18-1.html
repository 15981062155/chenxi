<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 姓名：陈曦，日期：2026-11-05，功能：Canvas 粒子文字动画（陈曦） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18-1 Canvas 文字动画 - 陈曦</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 16px 10px 0;
            color: #fff;
        }
        header h1 { font-size: 18px; letter-spacing: 4px; opacity: 0.9; }
        header p { font-size: 12px; opacity: 0.5; margin-top: 4px; }

        canvas {
            display: block;
            width: 100%;
            height: calc(100vh - 120px);
        }

        .cx_controls {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cx_btn {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .cx_btn:hover { background: rgba(255, 255, 255, 0.2); }
        .cx_btn.active { background: #1e4b3b; border-color: #1e4b3b; }
    </style>
</head>
<body>
    <header>
        <h1>陈 曦</h1>
        <p>姓名：陈曦 · 18-1 · Canvas 粒子文字动画</p>
    </header>

    <canvas id="cx_canvas"></canvas>

    <div class="cx_controls">
        <button class="cx_btn active" data-mode="attract">吸引模式</button>
        <button class="cx_btn" data-mode="repel">排斥模式</button>
        <button class="cx_btn" data-mode="mouse">鼠标跟随</button>
        <button class="cx_btn" data-mode="shatter">爆炸重组</button>
    </div>

    <script>
        var cx_canvas = document.getElementById('cx_canvas');
        var cx_ctx = cx_canvas.getContext('2d');
        var cx_W = 0, cx_H = 0;
        var cx_particles = [];
        var cx_mode = 'attract';
        var cx_targetText = '陈曦';
        var cx_fontSize = 220;

        function cx_resize() {
            cx_W = cx_canvas.width = cx_canvas.clientWidth;
            cx_H = cx_canvas.height = cx_canvas.clientHeight;
            cx_fontSize = Math.max(80, Math.min(260, Math.min(cx_W / 3, cx_H / 2)));
            cx_buildText();
        }

        function cx_getTextPoints(text) {
            var off = document.createElement('canvas');
            off.width = Math.max(400, cx_W);
            off.height = Math.max(200, cx_H);
            var octx = off.getContext('2d');
            octx.fillStyle = '#fff';
            octx.font = 'bold ' + cx_fontSize + 'px "PingFang SC","Microsoft YaHei",sans-serif';
            octx.textAlign = 'center';
            octx.textBaseline = 'middle';
            octx.fillText(text, off.width / 2, off.height / 2);

            var img = octx.getImageData(0, 0, off.width, off.height);
            var step = Math.max(3, Math.floor(cx_fontSize / 55));
            var pts = [];
            for (var y = 0; y < off.height; y += step) {
                for (var x = 0; x < off.width; x += step) {
                    var i = (y * off.width + x) * 4 + 3;
                    if (img.data[i] > 128) {
                        pts.push({ x: x - off.width / 2, y: y - off.height / 2 });
                    }
                }
            }
            return pts;
        }

        function cx_buildText() {
            var targets = cx_getTextPoints(cx_targetText);
            var cx = cx_W / 2, cy = cx_H / 2;
            while (cx_particles.length < targets.length) {
                cx_particles.push({
                    tx: 0, ty: 0, x: Math.random() * cx_W, y: Math.random() * cx_H,
                    vx: 0, vy: 0, size: 1.8,
                    hue: Math.random() * 60 + 140
                });
            }
            for (var i = 0; i < cx_particles.length; i++) {
                cx_particles[i].tx = cx + (targets[i] || { x: 0, y: 0 }).x;
                cx_particles[i].ty = cy + (targets[i] || { x: 0, y: 0 }).y;
            }
            cx_particles.length = targets.length;
        }

        var cx_mouse = { x: -9999, y: -9999 };
        cx_canvas.addEventListener('mousemove', function (e) {
            var r = cx_canvas.getBoundingClientRect();
            cx_mouse.x = e.clientX - r.left;
            cx_mouse.y = e.clientY - r.top;
        });
        cx_canvas.addEventListener('mouseleave', function () {
            cx_mouse.x = -9999; cx_mouse.y = -9999;
        });

        var cx_shatterTimer = 0;
        function cx_shatter() {
            cx_particles.forEach(function (p) {
                var ang = Math.random() * Math.PI * 2;
                var dist = 200 + Math.random() * 300;
                p.vx = Math.cos(ang) * dist;
                p.vy = Math.sin(ang) * dist;
            });
        }

        document.querySelectorAll('.cx_btn').forEach(function (b) {
            b.addEventListener('click', function () {
                document.querySelectorAll('.cx_btn').forEach(function (x) { x.classList.remove('active'); });
                b.classList.add('active');
                cx_mode = b.getAttribute('data-mode');
                if (cx_mode === 'shatter') cx_shatter();
            });
        });

        function cx_update() {
            cx_particles.forEach(function (p) {
                var dx = p.tx - p.x;
                var dy = p.ty - p.y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                var force = 0.06;

                if (cx_mode === 'attract' || cx_mode === 'shatter') {
                    p.vx += dx * force;
                    p.vy += dy * force;
                    var mdx = cx_mouse.x - p.x, mdy = cx_mouse.y - p.y;
                    var md = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (md < 120) {
                        var f = (120 - md) / 120 * 0.5;
                        p.vx += mdx * f;
                        p.vy += mdy * f;
                    }
                } else if (cx_mode === 'repel') {
                    p.vx += dx * force;
                    p.vy += dy * force;
                    var mdx2 = cx_mouse.x - p.x, mdy2 = cx_mouse.y - p.y;
                    var md2 = Math.sqrt(mdx2 * mdx2 + mdy2 * mdy2);
                    if (md2 < 150) {
                        var f2 = (150 - md2) / 150 * 4;
                        p.vx -= mdx2 * f2;
                        p.vy -= mdy2 * f2;
                    }
                } else if (cx_mode === 'mouse') {
                    var mdx3 = cx_mouse.x - p.x, mdy3 = cx_mouse.y - p.y;
                    var md3 = Math.sqrt(mdx3 * mdx3 + mdy3 * mdy3);
                    if (md3 < 200) {
                        p.vx += mdx3 * 0.02;
                        p.vy += mdy3 * 0.02;
                    } else {
                        p.vx += dx * force;
                        p.vy += dy * force;
                    }
                }

                p.vx *= 0.88;
                p.vy *= 0.88;
                p.x += p.vx;
                p.y += p.vy;
            });
        }

        function cx_draw() {
            cx_ctx.fillStyle = 'rgba(10, 10, 26, 0.25)';
            cx_ctx.fillRect(0, 0, cx_W, cx_H);
            cx_particles.forEach(function (p) {
                cx_ctx.beginPath();
                cx_ctx.fillStyle = 'hsl(' + p.hue + ', 90%, 65%)';
                cx_ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                cx_ctx.fill();
            });
        }

        function cx_loop() {
            cx_update();
            cx_draw();
            requestAnimationFrame(cx_loop);
        }

        cx_resize();
        cx_loop();
        window.addEventListener('resize', cx_resize);
    </script>
</body>
</html>
