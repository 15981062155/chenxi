<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 姓名：陈曦，日期：2026-11-05，功能：ECharts 折线图 + 3D 中国地图 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18-4 ECharts 折线图 + 3D地图 - 陈曦</title>
    <script src="cdn/echarts/echarts.min.js"></script>
    <script src="cdn/echarts/echarts-gl.min.js"></script>
    <style>
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 28px 16px;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            text-align: center;
            color: #eee;
        }

        h1 { color: #00d4ff; margin: 0 0 4px; font-size: 24px; letter-spacing: 2px; }
        .cx_subtitle { color: #aaa; font-size: 13px; margin: 0 0 22px; }

        .cx_chart-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 18px;
            margin: 0 auto 24px;
            max-width: 1200px;
            border: 1px solid rgba(0, 212, 255, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            text-align: left;
        }

        .cx_chart-title {
            color: #00d4ff;
            margin: 0 0 12px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cx_chart-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background: linear-gradient(#00d4ff, #ff6b6b);
            border-radius: 2px;
        }
        .cx_chart-title em {
            color: #888;
            font-style: normal;
            font-size: 12px;
            font-weight: normal;
            margin-left: auto;
        }

        .cx_canvas {
            width: 100%;
            height: 520px;
            display: block;
        }

        .cx_tip {
            color: #ff6b6b;
            font-size: 11px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>ECharts 折线图 · 3D 中国地图</h1>
    <p class="cx_subtitle">本地 CDN · 姓名：陈曦 · 18-4</p>

    <div class="cx_chart-card">
        <div class="cx_chart-title">
            📈 多系列折线图（平滑曲线 + 渐变填充）
            <em>Line Chart</em>
        </div>
        <div id="cx_line" class="cx_canvas"></div>
    </div>

    <div class="cx_chart-card">
        <div class="cx_chart-title">
            🗺️ 3D 中国地图（Map3D · 飞线 + 热力柱）
            <em>需要通过 HTTP 服务访问</em>
        </div>
        <div id="cx_map3d" class="cx_canvas"></div>
        <div class="cx_tip" id="cx_mapTip"></div>
    </div>

    <script>
        (function () {
            var cx_lineChart = echarts.init(document.getElementById('cx_line'));

            var cx_months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

            cx_lineChart.setOption({
                backgroundColor: 'transparent',
                title: {
                    text: '2025 年月度数据对比',
                    subtext: '单位：万元',
                    textStyle: { color: '#eee', fontSize: 16 },
                    subtextStyle: { color: '#888' },
                    left: 'center',
                    top: 8
                },
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(15,32,39,0.9)',
                    borderColor: '#00d4ff',
                    borderWidth: 1,
                    textStyle: { color: '#fff' },
                    axisPointer: { type: 'cross', label: { backgroundColor: '#00d4ff' } }
                },
                legend: {
                    data: ['销售额', '成本', '利润', '现金流'],
                    top: 40,
                    textStyle: { color: '#ccc' }
                },
                grid: { left: 50, right: 40, top: 80, bottom: 40 },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: cx_months,
                    axisLine: { lineStyle: { color: '#446' } },
                    axisLabel: { color: '#aaa' }
                },
                yAxis: {
                    type: 'value',
                    axisLine: { lineStyle: { color: '#446' } },
                    axisLabel: { color: '#aaa' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } }
                },
                series: [
                    {
                        name: '销售额',
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 8,
                        lineStyle: { width: 3, color: '#00d4ff' },
                        itemStyle: { color: '#00d4ff' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(0,212,255,0.5)' },
                                { offset: 1, color: 'rgba(0,212,255,0.02)' }
                            ])
                        },
                        data: [320, 382, 401, 434, 490, 530, 560, 612, 680, 721, 763, 851]
                    },
                    {
                        name: '成本',
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 8,
                        lineStyle: { width: 3, color: '#ff6b6b' },
                        itemStyle: { color: '#ff6b6b' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(255,107,107,0.4)' },
                                { offset: 1, color: 'rgba(255,107,107,0.02)' }
                            ])
                        },
                        data: [240, 280, 302, 341, 390, 430, 455, 490, 540, 580, 610, 690]
                    },
                    {
                        name: '利润',
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 8,
                        lineStyle: { width: 3, color: '#51cf66' },
                        itemStyle: { color: '#51cf66' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(81,207,102,0.4)' },
                                { offset: 1, color: 'rgba(81,207,102,0.02)' }
                            ])
                        },
                        data: [80, 102, 99, 93, 100, 100, 105, 122, 140, 141, 153, 161]
                    },
                    {
                        name: '现金流',
                        type: 'line',
                        smooth: true,
                        symbol: 'diamond',
                        symbolSize: 9,
                        lineStyle: { width: 3, color: '#ffd43b', type: 'dashed' },
                        itemStyle: { color: '#ffd43b' },
                        data: [70, 90, 85, 88, 95, 92, 100, 115, 130, 135, 142, 155]
                    }
                ]
            });

            var cx_mapChart = echarts.init(document.getElementById('cx_map3d'));
            var cx_mapTip = document.getElementById('cx_mapTip');

            fetch('cdn/echarts/china.json')
                .then(function (r) { return r.json(); })
                .then(function (chinaJson) {
                    echarts.registerMap('china', chinaJson);

                    var cx_cities = [
                        { name: '北京', value: [116.46, 39.92, 150] },
                        { name: '上海', value: [121.48, 31.22, 180] },
                        { name: '广州', value: [113.23, 23.16, 120] },
                        { name: '深圳', value: [114.07, 22.62, 140] },
                        { name: '杭州', value: [120.19, 30.26, 100] },
                        { name: '成都', value: [104.06, 30.67, 90] },
                        { name: '武汉', value: [114.31, 30.52, 85] },
                        { name: '西安', value: [108.95, 34.27, 70] },
                        { name: '重庆', value: [106.54, 29.59, 75] },
                        { name: '南京', value: [118.78, 32.04, 80] },
                        { name: '天津', value: [117.2, 39.13, 88] },
                        { name: '苏州', value: [120.62, 31.32, 95] },
                        { name: '长沙', value: [112.94, 28.23, 60] },
                        { name: '青岛', value: [120.33, 36.07, 65] },
                        { name: '厦门', value: [118.1, 24.46, 55] }
                    ];

                    var cx_flightLines = [
                        { coords: [[116.46, 39.92], [121.48, 31.22]] },
                        { coords: [[116.46, 39.92], [113.23, 23.16]] },
                        { coords: [[116.46, 39.92], [104.06, 30.67]] },
                        { coords: [[121.48, 31.22], [114.07, 22.62]] },
                        { coords: [[121.48, 31.22], [120.19, 30.26]] },
                        { coords: [[113.23, 23.16], [114.07, 22.62]] },
                        { coords: [[104.06, 30.67], [106.54, 29.59]] },
                        { coords: [[108.95, 34.27], [116.46, 39.92]] },
                        { coords: [[114.31, 30.52], [121.48, 31.22]] },
                        { coords: [[118.78, 32.04], [120.62, 31.32]] }
                    ];

                    cx_mapChart.setOption({
                        backgroundColor: 'transparent',
                        title: {
                            text: '中国经济中心 3D 可视化',
                            subtext: '飞线：商务往来 · 热力柱：城市热度',
                            textStyle: { color: '#eee', fontSize: 16 },
                            subtextStyle: { color: '#888' },
                            left: 'center',
                            top: 8
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15,32,39,0.9)',
                            borderColor: '#00d4ff',
                            textStyle: { color: '#fff' }
                        },
                        visualMap: {
                            show: true,
                            left: 20,
                            bottom: 20,
                            min: 0,
                            max: 200,
                            text: ['高', '低'],
                            textStyle: { color: '#fff' },
                            inRange: {
                                color: ['#00d4ff', '#00b4d8', '#90e0ef', '#caf0f8']
                            }
                        },
                        geo3D: {
                            map: 'china',
                            boxWidth: 100,
                            boxDepth: 100,
                            boxHeight: 5,
                            regionHeight: 3,
                            shading: 'realistic',
                            realisticMaterial: {
                                roughness: 0.6,
                                metalness: 0.1
                            },
                            postEffect: {
                                enable: true,
                                SSAO: { enable: true, quality: 'medium', radius: 2 }
                            },
                            light: {
                                main: { intensity: 1.2, shadow: true },
                                ambient: { intensity: 0.3 }
                            },
                            viewControl: {
                                distance: 150,
                                autoRotate: true,
                                panMouseButton: 'left',
                                rotateMouseButton: 'right'
                            },
                            itemStyle: {
                                color: '#1b3a4b',
                                borderWidth: 1,
                                borderColor: '#00d4ff'
                            },
                            emphasis: {
                                itemStyle: { color: '#00d4ff' },
                                label: { color: '#fff' }
                            }
                        },
                        series: [
                            {
                                name: '城市热度',
                                type: 'bar3D',
                                coordinateSystem: 'geo3D',
                                barSize: 1.5,
                                data: cx_cities,
                                itemStyle: {
                                    color: function (p) {
                                        return new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                            { offset: 0, color: '#ff6b6b' },
                                            { offset: 1, color: '#ffd43b' }
                                        ]);
                                    }
                                },
                                label: {
                                    show: true,
                                    position: 'top',
                                    formatter: '{b}',
                                    color: '#fff',
                                    fontSize: 10
                                }
                            },
                            {
                                name: '商务飞线',
                                type: 'lines3D',
                                coordinateSystem: 'geo3D',
                                effect: {
                                    show: true,
                                    trailLength: 0.2,
                                    symbolSize: 4,
                                    color: '#fff'
                                },
                                blendMode: 'lighter',
                                lineStyle: {
                                    width: 1,
                                    opacity: 0.6,
                                    color: '#00d4ff',
                                    curveness: 0.3
                                },
                                data: cx_flightLines
                            },
                            {
                                name: '城市散点',
                                type: 'scatter3D',
                                coordinateSystem: 'geo3D',
                                symbolSize: 6,
                                itemStyle: { color: '#ffd43b' },
                                data: cx_cities
                            }
                        ]
                    });

                    cx_mapTip.textContent = '';
                })
                .catch(function (err) {
                    cx_mapTip.innerHTML = '⚠️ 地图数据加载失败：' + err.message +
                        '<br/><small>请通过本地 HTTP 服务访问（如 python -m http.server 8080），不要用 file:// 协议打开</small>';
                });

            window.addEventListener('resize', function () {
                cx_lineChart.resize();
                cx_mapChart.resize();
            });
        })();
    </script>
</body>
</html>
