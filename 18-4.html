<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 姓名：陈曦，日期：2026-11-05，功能：ECharts 折线图 + 南丁格尔玫瑰图 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18-4 ECharts 折线图 + 玫瑰图 - 陈曦</title>
    <script src="cdn/echarts/echarts.min.js"></script>
    <style>
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 28px 16px;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            text-align: center;
            color: #eee;
        }

        h1 { color: #00d4ff; margin: 0 0 4px; font-size: 24px; letter-spacing: 2px; }
        .cx_subtitle { color: #aaa; font-size: 13px; margin: 0 0 22px; }

        .cx_chart-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 18px;
            margin: 0 auto 24px;
            max-width: 1200px;
            border: 1px solid rgba(0, 212, 255, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            text-align: left;
        }

        .cx_chart-title {
            color: #00d4ff;
            margin: 0 0 12px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cx_chart-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background: linear-gradient(#00d4ff, #ff6b6b);
            border-radius: 2px;
        }
        .cx_chart-title em {
            color: #888;
            font-style: normal;
            font-size: 12px;
            font-weight: normal;
            margin-left: auto;
        }

        .cx_canvas {
            width: 100%;
            height: 520px;
            display: block;
        }

        .cx_tip {
            color: #ff6b6b;
            font-size: 11px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>ECharts 折线图 · 南丁格尔玫瑰图</h1>
    <p class="cx_subtitle">本地 CDN · 姓名：陈曦 · 18-4</p>

    <div class="cx_chart-card">
        <div class="cx_chart-title">
            📈 多系列折线图（平滑曲线 + 渐变填充）
            <em>Line Chart</em>
        </div>
        <div id="cx_line" class="cx_canvas"></div>
    </div>

    <div class="cx_chart-card">
        <div class="cx_chart-title">
            � 南丁格尔玫瑰图（Pie + RoseType）
            <em>分类数据极坐标可视化</em>
        </div>
        <div id="cx_map3d" class="cx_canvas"></div>
    </div>

    <script>
        (function () {
            var cx_lineChart = echarts.init(document.getElementById('cx_line'));

            var cx_months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

            cx_lineChart.setOption({
                backgroundColor: 'transparent',
                title: {
                    text: '2025 年月度数据对比',
                    subtext: '单位：万元',
                    textStyle: { color: '#eee', fontSize: 16 },
                    subtextStyle: { color: '#888' },
                    left: 'center',
                    top: 8
                },
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(15,32,39,0.9)',
                    borderColor: '#00d4ff',
                    borderWidth: 1,
                    textStyle: { color: '#fff' },
                    axisPointer: { type: 'cross', label: { backgroundColor: '#00d4ff' } }
                },
                legend: {
                    data: ['销售额', '成本', '利润', '现金流'],
                    top: 40,
                    textStyle: { color: '#ccc' }
                },
                grid: { left: 50, right: 40, top: 80, bottom: 40 },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: cx_months,
                    axisLine: { lineStyle: { color: '#446' } },
                    axisLabel: { color: '#aaa' }
                },
                yAxis: {
                    type: 'value',
                    axisLine: { lineStyle: { color: '#446' } },
                    axisLabel: { color: '#aaa' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } }
                },
                series: [
                    {
                        name: '销售额',
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 8,
                        lineStyle: { width: 3, color: '#00d4ff' },
                        itemStyle: { color: '#00d4ff' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(0,212,255,0.5)' },
                                { offset: 1, color: 'rgba(0,212,255,0.02)' }
                            ])
                        },
                        data: [320, 382, 401, 434, 490, 530, 560, 612, 680, 721, 763, 851]
                    },
                    {
                        name: '成本',
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 8,
                        lineStyle: { width: 3, color: '#ff6b6b' },
                        itemStyle: { color: '#ff6b6b' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(255,107,107,0.4)' },
                                { offset: 1, color: 'rgba(255,107,107,0.02)' }
                            ])
                        },
                        data: [240, 280, 302, 341, 390, 430, 455, 490, 540, 580, 610, 690]
                    },
                    {
                        name: '利润',
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 8,
                        lineStyle: { width: 3, color: '#51cf66' },
                        itemStyle: { color: '#51cf66' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(81,207,102,0.4)' },
                                { offset: 1, color: 'rgba(81,207,102,0.02)' }
                            ])
                        },
                        data: [80, 102, 99, 93, 100, 100, 105, 122, 140, 141, 153, 161]
                    },
                    {
                        name: '现金流',
                        type: 'line',
                        smooth: true,
                        symbol: 'diamond',
                        symbolSize: 9,
                        lineStyle: { width: 3, color: '#ffd43b', type: 'dashed' },
                        itemStyle: { color: '#ffd43b' },
                        data: [70, 90, 85, 88, 95, 92, 100, 115, 130, 135, 142, 155]
                    }
                ]
            });

            var cx_roseChart = echarts.init(document.getElementById('cx_map3d'));

            var cx_roseData = [
                { value: 40, name: 'React' },
                { value: 38, name: 'Vue' },
                { value: 28, name: 'Angular' },
                { value: 22, name: 'Svelte' },
                { value: 18, name: 'Solid' },
                { value: 32, name: 'TypeScript' },
                { value: 26, name: 'Node.js' },
                { value: 20, name: 'Deno' },
                { value: 15, name: 'Bun' },
                { value: 30, name: 'Next.js' },
                { value: 24, name: 'Nuxt' },
                { value: 19, name: 'Remix' }
            ];

            cx_roseChart.setOption({
                backgroundColor: 'transparent',
                title: {
                    text: '前端技术栈热度排行',
                    subtext: '南丁格尔玫瑰图 · 2026 调研数据',
                    textStyle: { color: '#eee', fontSize: 18 },
                    subtextStyle: { color: '#888' },
                    left: 'center',
                    top: 10
                },
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(15,32,39,0.9)',
                    borderColor: '#00d4ff',
                    textStyle: { color: '#fff' },
                    formatter: '{b}<br/>热度指数：<b>{c}</b> ({d}%)'
                },
                legend: {
                    orient: 'vertical',
                    left: 10,
                    top: 60,
                    textStyle: { color: '#ccc' },
                    itemGap: 12
                },
                series: [
                    {
                        name: '技术热度',
                        type: 'pie',
                        radius: ['20%', '70%'],
                        center: ['58%', '58%'],
                        roseType: 'area',
                        avoidLabelOverlap: true,
                        itemStyle: {
                            borderRadius: 6,
                            borderColor: 'rgba(255,255,255,0.08)',
                            borderWidth: 1
                        },
                        label: {
                            show: true,
                            color: '#ddd',
                            fontSize: 12,
                            formatter: '{b}\n{c}'
                        },
                        labelLine: {
                            length: 15,
                            length2: 10,
                            lineStyle: { color: '#888' }
                        },
                        emphasis: {
                            label: { color: '#fff', fontSize: 14 },
                            itemStyle: { shadowBlur: 20, shadowColor: 'rgba(0,212,255,0.5)' }
                        },
                        color: ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#38d9a9',
                                '#22b8cf', '#4dabf7', '#748ffc', '#9775fa', '#da77f2',
                                '#f783ac', '#e64980'],
                        data: cx_roseData
                    }
                ]
            });

            window.addEventListener('resize', function () {
                cx_lineChart.resize();
                cx_roseChart.resize();
            });
        })();
    </script>
</body>
</html>
