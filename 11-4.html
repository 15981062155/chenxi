<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CSS 3D 星空闪烁动画练习">
    <title>11-4 · 星星闪烁的 3D 动画</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: #eef4ff;
            background: #080d1d;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            padding: 28px 18px;
            background:
                radial-gradient(ellipse at 50% 42%, rgba(42, 61, 115, 0.42), transparent 55%),
                linear-gradient(145deg, #080d1d, #10172c 58%, #090e1d);
        }

        .chenxi_star-page {
            width: min(980px, 100%);
        }

        .chenxi_home {
            display: inline-block;
            margin-bottom: 18px;
            color: #b8c8ed;
            font-size: 14px;
            text-decoration: none;
        }

        .chenxi_home:hover,
        .chenxi_home:focus-visible {
            color: #fff;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .chenxi_star-card {
            padding: clamp(22px, 5vw, 42px);
            overflow: hidden;
            border: 1px solid rgba(172, 194, 255, 0.17);
            border-radius: 24px;
            background: rgba(14, 22, 43, 0.82);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
        }

        .chenxi_star-heading {
            text-align: center;
        }

        .chenxi_star-kicker {
            margin: 0 0 10px;
            color: #9bb7ff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.28em;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Songti SC", serif;
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 500;
            letter-spacing: 0.08em;
        }

        .chenxi_star-intro {
            max-width: 640px;
            margin: 14px auto 0;
            color: #aab6d0;
            font-size: 14px;
            line-height: 1.9;
        }

        .chenxi_sky {
            position: relative;
            height: clamp(300px, 48vw, 440px);
            margin-top: 28px;
            overflow: hidden;
            isolation: isolate;
            border: 1px solid rgba(172, 194, 255, 0.13);
            border-radius: 18px;
            background:
                radial-gradient(ellipse at 50% 52%, rgba(70, 89, 160, 0.2), transparent 52%),
                linear-gradient(180deg, #080e20, #101a35 60%, #0a1022);
            perspective: 720px;
        }

        .chenxi_sky::before,
        .chenxi_sky::after {
            position: absolute;
            inset: 0;
            z-index: -1;
            content: "";
            pointer-events: none;
        }

        .chenxi_sky::before {
            opacity: 0.5;
            background-image: radial-gradient(1px 1px at 12% 22%, #fff 99%, transparent),
                radial-gradient(1px 1px at 78% 18%, #b9d7ff 99%, transparent),
                radial-gradient(1px 1px at 31% 74%, #fff 99%, transparent),
                radial-gradient(1px 1px at 89% 68%, #fff 99%, transparent),
                radial-gradient(1px 1px at 57% 31%, #c5d9ff 99%, transparent);
            background-size: 190px 170px;
            animation: chenxi_distant-twinkle 5s ease-in-out infinite alternate;
        }

        .chenxi_sky::after {
            inset: auto 0 0;
            height: 34%;
            background: linear-gradient(0deg, rgba(37, 48, 91, 0.42), transparent);
        }

        .chenxi_star-field {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            animation: chenxi_sky-drift 18s ease-in-out infinite alternate;
        }

        .chenxi_star {
            position: absolute;
            top: var(--y);
            left: var(--x);
            color: var(--star-color, #e6efff);
            font-family: Georgia, serif;
            font-size: var(--size, 22px);
            line-height: 1;
            text-shadow: 0 0 8px currentColor, 0 0 22px currentColor;
            transform: translate3d(0, 0, var(--depth, 0px));
            animation: chenxi_twinkle var(--duration, 2.8s) ease-in-out var(--delay, 0s) infinite;
            will-change: opacity, filter, scale;
        }

        .chenxi_star:nth-child(3n) {
            --star-color: #f8dca0;
        }

        .chenxi_star:nth-child(4n) {
            --star-color: #b6d5ff;
        }

        .chenxi_star:nth-child(5n) {
            --star-color: #d7baff;
        }

        .chenxi_constellation {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            animation: chenxi_constellation-turn 16s linear infinite;
        }

        .chenxi_constellation-star {
            position: absolute;
            display: grid;
            width: 96px;
            height: 96px;
            place-items: center;
            color: #fff4c4;
            font-size: 78px;
            line-height: 1;
            text-shadow: 0 0 12px #ffe9a6, 0 0 32px #91aaff, 0 0 68px #668aff;
            transform: translate(-50%, -50%) translateZ(0);
            animation: chenxi_core-pulse 2.4s ease-in-out infinite alternate;
            backface-visibility: hidden;
        }

        .chenxi_constellation-star:nth-child(1) {
            transform: translate(-50%, -50%) translateZ(20px);
        }

        .chenxi_constellation-star:nth-child(2) {
            transform: translate(-50%, -50%) rotateY(90deg) translateZ(20px);
        }

        .chenxi_constellation-star:nth-child(3) {
            transform: translate(-50%, -50%) rotateX(90deg) translateZ(20px);
        }

        .chenxi_orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 210px;
            height: 210px;
            border: 1px solid rgba(156, 190, 255, 0.24);
            border-radius: 50%;
            box-shadow: 0 0 22px rgba(106, 148, 255, 0.12), inset 0 0 22px rgba(106, 148, 255, 0.08);
            transform-style: preserve-3d;
        }

        .chenxi_orbit--one {
            transform: translate(-50%, -50%) rotateX(68deg) rotateY(-18deg);
        }

        .chenxi_orbit--two {
            transform: translate(-50%, -50%) rotateY(68deg) rotateX(18deg);
        }

        .chenxi_orbit-dot {
            position: absolute;
            top: 50%;
            left: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d7e7ff;
            box-shadow: 0 0 12px 4px #87aaff;
            transform: translate(-50%, -50%);
        }

        .chenxi_caption {
            margin: 16px 0 0;
            color: #bac6df;
            font-size: 13px;
            line-height: 1.8;
            text-align: center;
        }

        .chenxi_technique {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
            margin-top: 18px;
        }

        .chenxi_technique span {
            padding: 7px 11px;
            border: 1px solid rgba(172, 194, 255, 0.16);
            border-radius: 999px;
            color: #cfdaef;
            background: rgba(101, 129, 207, 0.1);
            font-size: 11px;
        }

        @keyframes chenxi_twinkle {
            0%, 100% {
                opacity: 0.25;
                filter: brightness(0.75);
                scale: 0.68;
            }

            50% {
                opacity: 1;
                filter: brightness(1.65);
                scale: 1.18;
            }
        }

        @keyframes chenxi_distant-twinkle {
            from { opacity: 0.28; }
            to { opacity: 0.72; }
        }

        @keyframes chenxi_sky-drift {
            from { transform: rotateX(-3deg) rotateY(-5deg) translateZ(-8px); }
            to { transform: rotateX(4deg) rotateY(5deg) translateZ(8px); }
        }

        @keyframes chenxi_constellation-turn {
            from { transform: translate(-50%, -50%) rotateX(-16deg) rotateY(0deg); }
            to { transform: translate(-50%, -50%) rotateX(-16deg) rotateY(360deg); }
        }

        @keyframes chenxi_core-pulse {
            from { scale: 0.88; opacity: 0.78; }
            to { scale: 1.08; opacity: 1; }
        }

        @media (max-width: 560px) {
            .chenxi_star-card {
                padding: 22px 16px;
                border-radius: 18px;
            }

            .chenxi_orbit {
                width: 164px;
                height: 164px;
            }

            .chenxi_constellation-star {
                width: 76px;
                height: 76px;
                font-size: 62px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <main class="chenxi_star-page">
        <a class="chenxi_home" href="./index.html">← 返回首页</a>
        <section class="chenxi_star-card" aria-labelledby="star-title">
            <header class="chenxi_star-heading">
                <p class="chenxi_star-kicker">CSS 3D · ANIMATION</p>
                <h1 id="star-title">星河闪烁</h1>
                <p class="chenxi_star-intro">让星光在不同深度的空间里轻轻闪烁，中央的立体星体缓缓旋转，组成一片有层次的 3D 星空。</p>
            </header>

            <div class="chenxi_sky" role="img" aria-label="星星闪烁、中央立体星体旋转的 3D 星空动画">
                <div class="chenxi_star-field" aria-hidden="true">
                    <span class="chenxi_star" style="--x:8%;--y:18%;--size:17px;--depth:38px;--duration:2.5s;--delay:-1s">✦</span>
                    <span class="chenxi_star" style="--x:19%;--y:62%;--size:12px;--depth:-36px;--duration:3.1s;--delay:-2s">✧</span>
                    <span class="chenxi_star" style="--x:28%;--y:30%;--size:20px;--depth:72px;--duration:2.2s;--delay:-.5s">✦</span>
                    <span class="chenxi_star" style="--x:37%;--y:78%;--size:14px;--depth:-66px;--duration:3.4s;--delay:-2.6s">✧</span>
                    <span class="chenxi_star" style="--x:45%;--y:17%;--size:12px;--depth:24px;--duration:2.8s;--delay:-1.7s">✦</span>
                    <span class="chenxi_star" style="--x:57%;--y:24%;--size:16px;--depth:-52px;--duration:3.2s;--delay:-.8s">✧</span>
                    <span class="chenxi_star" style="--x:68%;--y:16%;--size:21px;--depth:60px;--duration:2.4s;--delay:-1.4s">✦</span>
                    <span class="chenxi_star" style="--x:82%;--y:30%;--size:13px;--depth:-24px;--duration:3.5s;--delay:-2.2s">✧</span>
                    <span class="chenxi_star" style="--x:91%;--y:18%;--size:18px;--depth:44px;--duration:2.7s;--delay:-.9s">✦</span>
                    <span class="chenxi_star" style="--x:11%;--y:82%;--size:12px;--depth:-72px;--duration:3s;--delay:-1.3s">✧</span>
                    <span class="chenxi_star" style="--x:24%;--y:45%;--size:11px;--depth:18px;--duration:2.6s;--delay:-2.1s">✦</span>
                    <span class="chenxi_star" style="--x:34%;--y:12%;--size:13px;--depth:-42px;--duration:3.3s;--delay:-.4s">✧</span>
                    <span class="chenxi_star" style="--x:73%;--y:77%;--size:17px;--depth:52px;--duration:2.3s;--delay:-1.8s">✦</span>
                    <span class="chenxi_star" style="--x:86%;--y:58%;--size:12px;--depth:-58px;--duration:3.6s;--delay:-.7s">✧</span>
                    <span class="chenxi_star" style="--x:95%;--y:82%;--size:15px;--depth:32px;--duration:2.9s;--delay:-2.4s">✦</span>
                    <span class="chenxi_star" style="--x:7%;--y:43%;--size:13px;--depth:-18px;--duration:3.2s;--delay:-1.1s">✧</span>
                    <span class="chenxi_star" style="--x:17%;--y:30%;--size:10px;--depth:66px;--duration:2.4s;--delay:-2.7s">✦</span>
                    <span class="chenxi_star" style="--x:30%;--y:87%;--size:16px;--depth:-30px;--duration:3.7s;--delay:-.6s">✧</span>
                    <span class="chenxi_star" style="--x:42%;--y:62%;--size:12px;--depth:46px;--duration:2.6s;--delay:-1.9s">✦</span>
                    <span class="chenxi_star" style="--x:62%;--y:84%;--size:13px;--depth:-74px;--duration:3.3s;--delay:-1.2s">✧</span>
                    <span class="chenxi_star" style="--x:77%;--y:43%;--size:10px;--depth:28px;--duration:2.8s;--delay:-2.3s">✦</span>
                    <span class="chenxi_star" style="--x:88%;--y:88%;--size:18px;--depth:-46px;--duration:3.4s;--delay:-.3s">✧</span>

                    <div class="chenxi_orbit chenxi_orbit--one"><span class="chenxi_orbit-dot"></span></div>
                    <div class="chenxi_orbit chenxi_orbit--two"><span class="chenxi_orbit-dot"></span></div>
                    <div class="chenxi_constellation">
                        <span class="chenxi_constellation-star">✦</span>
                        <span class="chenxi_constellation-star">✦</span>
                        <span class="chenxi_constellation-star">✦</span>
                    </div>
                </div>
            </div>

            <p class="chenxi_caption">星点以不同的 Z 轴距离构成立体层次；中央星体由多个旋转平面组成。</p>
            <div class="chenxi_technique" aria-label="使用的 CSS 技术">
                <span>perspective</span>
                <span>translate3d</span>
                <span>preserve-3d</span>
                <span>@keyframes</span>
                <span>错峰闪烁</span>
            </div>
        </section>
    </main>
</body>
</html>
