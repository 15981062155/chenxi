<body>
    <h1>JavaScript 对象与字符串图解</h1>
    <p class="cx_author">姓名：陈曦 · 第 16 章 · 对象 Object 与字符串 String 一图看懂</p>

    <div class="cx_container">

        <!-- ===== 对象输入条 ===== -->
        <div class="cx_bar">
            <label>对象（JSON）：</label>
            <input id="cx_objInput" value='{"name":"陈曦","age":20,"school":"阳光大学","score":88}'>

            <button class="cx_btn cx_btn-light" id="cx_objReset">重置对象</button>

        </div>

        <div id="cx_objParts"></div>

        <!-- ===== 字符串输入条 ===== -->
        <div class="cx_bar">
            <label>演示字符串：</label>
            <input id="cx_strInput" value="Hello JavaScript">
            <button class="cx_btn" id="cx_strApply">应用</button>
            <button class="cx_btn cx_btn-light" id="cx_strReset">重置字符串</button>
        </div>

        <div id="cx_strParts"></div>

        <!-- ===== 速查表 ===== -->
        <div class="cx_part">
            <h2>七、方法速查表</h2>
            <p class="cx_part-desc">对象与字符串的常用方法汇总，随用随查。</p>

            <h3 style="font-size:15px;color:#1e4b3b;margin:16px 0 4px;">对象常用方法</h3>
            <table>
                <thead>
                    <tr><th>方法 / 语法</th><th>作用</th><th>返回值</th></tr>
                </thead>
                <tbody id="cx_objTable"></tbody>
            </table>

            <h3 style="font-size:15px;color:#1f5c8b;margin:20px 0 4px;">字符串常用方法</h3>
            <table>
                <thead>
                    <tr><th>方法 / 语法</th><th>作用</th><th>返回值</th></tr>
                </thead>
                <tbody id="cx_strTable"></tbody>
            </table>
        </div>

    </div>

    <script>
        /* =========================================================
           陈曦 · 16-2  JavaScript 对象与字符串图解
           ========================================================= */

        var CX_OBJ_DEFAULT = { name: "陈曦", age: 20, school: "阳光大学", score: 88 };
        var CX_STR_DEFAULT = "Hello JavaScript";

        var cx_obj = {};
        var cx_str = CX_STR_DEFAULT;

        for (var cx_k in CX_OBJ_DEFAULT) cx_obj[cx_k] = CX_OBJ_DEFAULT[cx_k];

        /* ---------- 工具函数 ---------- */
        function cx_show(v) {
            if (Array.isArray(v)) return "[" + v.map(cx_show).join(", ") + "]";
            if (typeof v === "function") return "ƒ function()";
            if (v === null) return "null";
            if (typeof v === "string") return '"' + v + '"';
            if (typeof v === "undefined") return "undefined";
            if (typeof v === "object") return JSON.stringify(v);
            return String(v);
        }

        function cx_esc(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function cx_clone(o) {
            var n = {};
            for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) n[k] = o[k];
            return n;
        }

        /* ---------- 代码高亮 ---------- */
        function cx_hl(src) {
            var re = /(\/\/[^\n]*)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(var|let|const|function|return|if|else|for|of|in|new|true|false|null|undefined|delete|this)\b|\b(\d+)\b/g;
            var out = "", last = 0, m;
            while ((m = re.exec(src)) !== null) {
                out += cx_esc(src.slice(last, m.index));
                if (m[1]) out += '<span class="cx_c">' + cx_esc(m[1]) + '</span>';
                else if (m[2]) out += '<span class="cx_s">' + cx_esc(m[2]) + '</span>';
                else if (m[3]) out += '<span class="cx_k">' + cx_esc(m[3]) + '</span>';
                else out += '<span class="cx_n">' + cx_esc(m[4]) + '</span>';
                last = m.index + m[0].length;
            }
            out += cx_esc(src.slice(last));
            return out;
        }

        /* ---------- 渲染：对象盒 ---------- */
        function cx_renderObj(box, obj, opt, label) {
            opt = opt || {};
            var wrap = document.createElement("div");

            if (label) {
                var lb = document.createElement("div");
                lb.className = "cx_obj-label";
                lb.textContent = label;
                wrap.appendChild(lb);
            }

            var ob = document.createElement("div");
            ob.className = "cx_obj";
            var keys = Object.keys(obj);

            if (keys.length === 0) {
                ob.innerHTML = '<span class="cx_empty">{ } 空对象</span>';
            }

            for (var i = 0; i < keys.length; i++) {
                var k = keys[i];
                var pair = document.createElement("div");
                pair.className = "cx_pair";
                if (opt.add && opt.add.indexOf(k) >= 0) pair.className += " cx_pair-add";
                if (opt.hit && opt.hit.indexOf(k) >= 0) pair.className += " cx_pair-hit";
                if (opt.del && opt.del.indexOf(k) >= 0) pair.className += " cx_pair-del";
                pair.innerHTML =
                    '<span class="cx_key">' + cx_esc(k) + '</span>' +
                    '<span class="cx_colon">:</span>' +
                    '<span class="cx_val">' + cx_esc(cx_show(obj[k])) + '</span>';
                ob.appendChild(pair);
            }

            wrap.appendChild(ob);
            box.appendChild(wrap);
        }

        /* ---------- 渲染：字符串字符格 ---------- */
        function cx_renderStr(box, str, opt, label) {
            opt = opt || {};
            var wrap = document.createElement("div");

            if (label) {
                var lb = document.createElement("div");
                lb.className = "cx_obj-label";
                lb.textContent = label;
                wrap.appendChild(lb);
            }

            var line = document.createElement("div");
            line.className = "cx_str";

            if (str === "") {
                line.innerHTML = '<span class="cx_empty">"" 空字符串</span>';
            }

            for (var i = 0; i < str.length; i++) {
                var ch = document.createElement("div");
                ch.className = "cx_ch";
                var showCh = str[i];
                var isSpace = (showCh === " ");
                if (isSpace) { showCh = "␣"; ch.className += " cx_ch-space"; }
                if (showCh === "\n") showCh = "⏎";
                if (opt.hit && opt.hit.indexOf(i) >= 0) ch.className += " cx_ch-hit";
                if (opt.cut && opt.cut.indexOf(i) >= 0) ch.className += " cx_ch-cut";
                if (opt.del && opt.del.indexOf(i) >= 0) ch.className += " cx_ch-del";
                if (opt.allNew) ch.className += " cx_ch-new";
                ch.innerHTML = "<b>" + cx_esc(showCh) + "</b><i>" + i + "</i>";
                line.appendChild(ch);
            }

            wrap.appendChild(line);
            box.appendChild(wrap);
        }

        /* ---------- 渲染：引用类型示意图 ---------- */
        function cx_renderRef(box, spec) {
            var d = spec.data;
            var wrap = document.createElement("div");
            wrap.className = "cx_ref";

            var vars = document.createElement("div");
            vars.className = "cx_vars";
            for (var i = 0; i < d.vars.length; i++) {
                var vb = document.createElement("div");
                vb.className = "cx_varbox";
                vb.textContent = d.vars[i];
                vars.appendChild(vb);
            }
            wrap.appendChild(vars);

            var ptr = document.createElement("div");
            ptr.className = "cx_ptr";
            for (var p = 0; p < d.vars.length; p++) {
                var a = document.createElement("div");
                a.textContent = "──→";
                ptr.appendChild(a);
            }
            wrap.appendChild(ptr);

            if (d.mode === "same") {
                cx_renderObj(wrap, d.obj, { hit: d.hit }, d.objLabel || "同一个对象");
            } else {
                var col = document.createElement("div");
                cx_renderObj(col, d.obj1, { hit: d.hit1 }, d.label1 || "对象 A");
                var sp = document.createElement("div");
                sp.style.height = "8px";
                col.appendChild(sp);
                cx_renderObj(col, d.obj2, { hit: d.hit2 }, d.label2 || "对象 B");
                wrap.appendChild(col);
            }

            if (spec.sub) {
                var nt = document.createElement("div");
                nt.className = "cx_ref-note";
                nt.textContent = spec.sub;
                wrap.appendChild(nt);
            }

            box.appendChild(wrap);
        }

        /* ---------- 渲染：数组方块（split 等结果） ---------- */
        function cx_renderCells(box, arr) {
            var wrap = document.createElement("div");
            wrap.className = "cx_cells";
            if (!arr || arr.length === 0) {
                wrap.innerHTML = '<span class="cx_empty">[ ] 空数组</span>';
            }
            for (var i = 0; i < arr.length; i++) {
                var c = document.createElement("div");

        /* ---------- 统一渲染入口 ---------- */
        function cx_renderSpec(box, spec) {
            box.innerHTML = "";
            if (!spec) return;

            if (spec.kind === "obj") {
                cx_renderObj(box, spec.data, spec, spec.label);
            } else if (spec.kind === "objs") {
                for (var i = 0; i < spec.data.length; i++) {
                    cx_renderObj(box, spec.data[i].obj, spec.data[i], spec.data[i].label);
                }
            } else if (spec.kind === "str") {
                cx_renderStr(box, spec.data, spec, spec.label);
            } else if (spec.kind === "ref") {
                cx_renderRef(box, spec);
            } else if (spec.kind === "array") {
                cx_renderCells(box, spec.data);
            } else if (spec.kind === "list") {
                var lg = document.createElement("div");
                lg.className = "cx_log";
                lg.textContent = spec.data;
                box.appendChild(lg);
            } else {
                var chip = document.createElement("span");
                chip.className = "cx_chip" +
                    (spec.red ? " cx_chip-red" : (spec.gray ? " cx_chip-gray" : (spec.blue ? " cx_chip-blue" : "")));
                chip.textContent = cx_show(spec.data);
                box.appendChild(chip);
            }

            if (spec.sub && spec.kind !== "ref") {
                var sub = document.createElement("span");
                sub.className = "cx_ret-txt";
                sub.textContent = " " + spec.sub;
                box.appendChild(sub);
            }
        }

            ["str.substring(开始, 结束)", "截取（不支持负数）", "新字符串"],
            ["str.split(分隔符)", "拆成数组", "数组"],
            ["str.replace(旧, 新)", "替换第一个匹配", "新字符串"],
            ["str.replaceAll(旧, 新)", "替换所有匹配", "新字符串"],
            ["str.toUpperCase()", "转大写", "新字符串"],
            ["str.toLowerCase()", "转小写", "新字符串"],
            ["str.trim()", "去掉两端空格", "新字符串"],
            ["str.repeat(次数)", "重复字符串", "新字符串"],
            ["str.padStart(长度, 字符)", "开头补齐", "新字符串"],
            ["str.padEnd(长度, 字符)", "结尾补齐", "新字符串"],
            ["str.concat(…)", "拼接字符串", "新字符串"],
            ["`文本${变量}`", "模板字符串", "新字符串"]
        ];

        /* =========================================================
           播放与构建
           ========================================================= */
        var cx_cards = [];
        var cx_timers = [];

        function cx_current(card, method) {
            var all = card.querySelectorAll(".cx_var");
            for (var i = 0; i < all.length; i++) {
                if (all[i].className.indexOf("cx_on") >= 0) return i;
            }
            return 0;
        }

        function cx_play(card, method, vi) {
            var variant = method.variants[vi];
            var arg = method.tag === "str" ? cx_str : cx_clone(cx_obj);
            var r = variant.run(arg);

            card.querySelector(".cx_code").innerHTML = cx_hl(variant.code);

            var noteEl = card.querySelector(".cx_note");
            if (r.note) {
                noteEl.style.display = "block";
                noteEl.innerHTML = r.note;
            } else {
                noteEl.style.display = "none";
            }

            // 操作前
            var beforeLine = card.querySelector(".cx_beforeLine");
            if (r.before) {
                beforeLine.style.display = "flex";
                cx_renderSpec(card.querySelector(".cx_before"), r.before);
            } else {
                beforeLine.style.display = "none";
            }

            // 箭头
            card.querySelector(".cx_arrow").textContent = "↓ " + method.name;

            // 操作后
            var afterLine = card.querySelector(".cx_afterLine");
            if (r.after) {
                afterLine.style.display = "flex";
                cx_renderSpec(card.querySelector(".cx_after"), r.after);
                var flag = card.querySelector(".cx_flag");
                flag.textContent = r.changed ? "已发生变化" : "原始数据未改变";
                flag.className = "cx_flag" + (r.changed ? "" : " cx_flag-no");
            } else {
                afterLine.style.display = "none";
            }

            // 结果
            card.querySelector(".cx_retTitle").textContent = (r.ret && r.ret.title) || "结果";
            cx_renderSpec(card.querySelector(".cx_ret"), r.ret);

            console.log("【" + method.name + "】" + variant.label +
                " → " + (r.ret ? cx_show(r.ret.data).slice(0, 60) : ""));
        }

        function cx_buildParts(parts, hostId) {
            var host = document.getElementById(hostId);
            host.innerHTML = "";

            for (var p = 0; p < parts.length; p++) {
                var part = parts[p];
                var sec = document.createElement("div");
                sec.className = "cx_part";

                var h2 = document.createElement("h2");
                h2.textContent = part.title;
                sec.appendChild(h2);

                var pd = document.createElement("p");
                pd.className = "cx_part-desc";
                pd.textContent = part.desc;
                sec.appendChild(pd);

                var grid = document.createElement("div");
                grid.className = "cx_grid";

                for (var m = 0; m < part.methods.length; m++) {
                    var method = part.methods[m];
                    var card = document.createElement("div");
                    card.className = "cx_card";

                    card.innerHTML =
                        '<h3>' + method.name +
                        '<span class="cx_tag ' + (method.tag === "str" ? 'cx_tag-str">字符串' : 'cx_tag-obj">对象') +
                        '</span></h3>' +
                        '<p class="cx_desc">' + method.desc + '</p>' +
                        '<pre class="cx_code"></pre>' +
                        '<div class="cx_btns"></div>' +
                        '<div class="cx_line cx_beforeLine"><span class="cx_lt">操作前</span><div class="cx_before"></div></div>' +
                        '<div class="cx_arrow"></div>' +
                        '<div class="cx_line cx_afterLine"><span class="cx_lt">操作后</span><div class="cx_after"></div><span class="cx_flag"></span></div>' +
                        '<div class="cx_line"><span class="cx_lt cx_retTitle">结果</span><div class="cx_ret"></div></div>' +
                        '<div class="cx_note"></div>';

                    var btns = card.querySelector(".cx_btns");
                    (function (method, card, btns) {
                        for (var v = 0; v < method.variants.length; v++) {
                            (function (vi) {
                                var b = document.createElement("button");
                                b.className = "cx_var" + (vi === 0 ? " cx_on" : "");
                                b.textContent = method.variants[vi].label;
                                b.onclick = function () {
                                    var all = btns.querySelectorAll(".cx_var");
                                    for (var k = 0; k < all.length; k++) all[k].className = "cx_var";
                                    b.className = "cx_var cx_on";
                                    cx_play(card, method, vi);
                                };
                                btns.appendChild(b);
                            })(v);
                        }
                        var rp = document.createElement("button");
                        rp.className = "cx_replay";
                        rp.textContent = "▶ 重播";
                        rp.onclick = function () {
                            cx_play(card, method, cx_current(card, method));
                        };
                        btns.appendChild(rp);
                    })(method, card, btns);

                    grid.appendChild(card);
                    cx_cards.push({ card: card, method: method });
                }

                sec.appendChild(grid);
                host.appendChild(sec);
            }
        }

        function cx_playAll() {
            for (var t = 0; t < cx_timers.length; t++) clearTimeout(cx_timers[t]);
            cx_timers = [];
            for (var i = 0; i < cx_cards.length; i++) {
                (function (item, idx) {
                    cx_timers.push(setTimeout(function () {
                        cx_play(item.card, item.method, cx_current(item.card, item.method));
                    }, idx * 80));
                })(cx_cards[i], i);
            }
        }

        function cx_buildTables() {
            var t1 = document.getElementById("cx_objTable");
            var html1 = "";
            for (var i = 0; i < cx_objTableData.length; i++) {
                html1 += "<tr><td><code>" + cx_esc(cx_objTableData[i][0]) + "</code></td><td>" +
                    cx_objTableData[i][1] + "</td><td>" + cx_objTableData[i][2] + "</td></tr>";
            }
            t1.innerHTML = html1;

            var t2 = document.getElementById("cx_strTable");
            var html2 = "";
            for (var j = 0; j < cx_strTableData.length; j++) {
                html2 += "<tr><td><code>" + cx_esc(cx_strTableData[j][0]) + "</code></td><td>" +
                    cx_strTableData[j][1] + "</td><td>" + cx_strTableData[j][2] + "</td></tr>";
            }
            t2.innerHTML = html2;
        }

        /* ---------- 事件 ---------- */
        document.getElementById("cx_objApply").onclick = function () {
            var txt = document.getElementById("cx_objInput").value.trim();
            try {
                var o = JSON.parse(txt);
                if (o === null || typeof o !== "object" || Array.isArray(o)) {
                    alert("请输入一个 JSON 对象，例如 {\"name\":\"陈曦\",\"age\":20}");
                    return;
                }
                cx_obj = o;
                cx_playAll();
            } catch (e) {
                alert("JSON 格式有误，请检查引号和逗号。\n示例：{\"name\":\"陈曦\",\"age\":20}");
            }
        };

        document.getElementById("cx_objReset").onclick = function () {
            cx_obj = cx_clone(CX_OBJ_DEFAULT);
            document.getElementById("cx_objInput").value = JSON.stringify(CX_OBJ_DEFAULT);
            cx_playAll();
        };

        document.getElementById("cx_strApply").onclick = function () {
            var v = document.getElementById("cx_strInput").value;
            if (v.length === 0) {
                alert("请输入一个字符串");
                return;
            }
            cx_str = v;
            cx_playAll();
        };

        document.getElementById("cx_strReset").onclick = function () {
            cx_str = CX_STR_DEFAULT;
            document.getElementById("cx_strInput").value = CX_STR_DEFAULT;
            cx_playAll();
        };

        document.getElementById("cx_replayAll").onclick = function () {
            cx_playAll();
        };

        /* ---------- 启动 ---------- */
        cx_buildParts(cx_objParts, "cx_objParts");
        cx_buildParts(cx_strParts, "cx_strParts");
        cx_buildTables();
        cx_playAll();

        console.log("===== 陈曦 · 16-2 对象与字符串图解 =====");
        console.log("当前对象：", cx_obj);
        console.log("当前字符串：", cx_str);
    </script>
</body>
</html>
