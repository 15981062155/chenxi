<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 姓名：陈曦，日期：2026-11-05，功能：ECharts+Globe3D 数据可视化大屏（三列） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18-8 数据可视化大屏 - 陈曦</title>
    <script src="cdn/echarts/echarts.min.js"></script>
    <script src="cdn/echarts/echarts-gl.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: radial-gradient(ellipse at center, #0b1a2a 0%, #050a14 100%);
            color: #e0f2fe;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }
        .cx_dash {
            height: 100vh;
            display: grid;
            grid-template-rows: 56px 1fr;
            padding: 10px 16px;
            gap: 10px;
        }
        .cx_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: linear-gradient(180deg, rgba(0,212,255,0.12), rgba(0,212,255,0.02));
            border: 1px solid rgba(0,212,255,0.25);
            border-radius: 10px;
            position: relative;
        }
        .cx_header::before, .cx_header::after {
            content: ''; position: absolute; top: 50%; width: 40px; height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff);
        }
        .cx_header::before { left: -20px; }
        .cx_header::after { right: -20px; transform: scaleX(-1); }
        .cx_header h1 {
            font-size: 22px; font-weight: 700; letter-spacing: 4px;
            background: linear-gradient(90deg, #00d4ff, #a78bfa);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .cx_header .cx_time { font-family: monospace; font-size: 14px; color: #94a3b8; }
        .cx_header .cx_stat { font-size: 12px; color: #64748b; }
        .cx_header .cx_stat b { color: #00d4ff; font-size: 16px; margin-right: 16px; }

        .cx_body {
            display: grid;
            grid-template-columns: 1fr 1.8fr 1fr;
            gap: 10px;
            min-height: 0;
        }
        .cx_col {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }
        .cx_panel {
            background: linear-gradient(180deg, rgba(0,212,255,0.06), rgba(10,30,50,0.6));
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }
        .cx_panel::before {
            content: ''; position: absolute; top: -1px; left: 20px; width: 40px; height: 2px;
            background: #00d4ff;
        }
        .cx_panel h3 {
            font-size: 14px; padding: 10px 14px; color: #7dd3fc;
            border-bottom: 1px solid rgba(0,212,255,0.15);
            flex-shrink: 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .cx_panel h3::before { content: '◆'; color: #00d4ff; font-size: 10px; margin-right: 6px; }
        .cx_panel h3 span { font-size: 11px; color: #475569; font-weight: normal; }
        .cx_panel .cx_chart { flex: 1; min-height: 0; padding: 6px; }

        .cx_rank { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 14px; }
        .cx_rank::-webkit-scrollbar { width: 4px; }
        .cx_rank::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 2px; }
        .cx_rank li {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 4px; font-size: 13px;
            border-bottom: 1px dashed rgba(0,212,255,0.1);
        }
        .cx_rank i {
            width: 20px; height: 20px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-style: normal; font-weight: bold; color: #fff;
            flex-shrink: 0;
        }
        .cx_rank li:nth-child(1) i { background: linear-gradient(135deg, #f59e0b, #ef4444); }
        .cx_rank li:nth-child(2) i { background: linear-gradient(135deg, #94a3b8, #64748b); }
        .cx_rank li:nth-child(3) i { background: linear-gradient(135deg, #d97706, #92400e); }
        .cx_rank li:nth-child(n+4) i { background: #334155; color: #94a3b8; }
        .cx_rank .cx_name { flex: 1; color: #cbd5e1; }
        .cx_rank .cx_bar {
            width: 100px; height: 6px; background: rgba(0,212,255,0.1);
            border-radius: 3px; overflow: hidden; position: relative;
        }
        .cx_rank .cx_bar span {
            display: block; height: 100%;
            background: linear-gradient(90deg, #00d4ff, #a78bfa);
            border-radius: 3px;
        }
        .cx_rank .cx_val { width: 60px; text-align: right; font-family: monospace; color: #7dd3fc; }
    </style>
</head>
<body>
    <div class="cx_dash">
        <div class="cx_header">
            <div class="cx_stat">
                <b id="cx_stat1">128.6万</b>今日访问
                <b id="cx_stat2">98.2%</b>在线率
                <b id="cx_stat3">47ms</b>平均延迟
            </div>
            <h1>🌐 全球运营实时数据可视化大屏</h1>
            <div class="cx_time" id="cx_time">--:--:--</div>
        </div>

        <div class="cx_body">
            <!-- 左列 -->
            <div class="cx_col">
                <div class="cx_panel" style="flex:0.9">
                    <h3>设备访问来源 <span>DEVICE SOURCE</span></h3>
                    <div class="cx_chart" id="cx_pie"></div>
                </div>
                <div class="cx_panel" style="flex:0.6">
                    <h3>系统健康度 <span>HEALTH</span></h3>
                    <div class="cx_chart" id="cx_gauge"></div>
                </div>
                <div class="cx_panel" style="flex:0.8">
                    <h3>近 12 月营收 <span>REVENUE</span></h3>
                    <div class="cx_chart" id="cx_bar"></div>
                </div>
            </div>

            <!-- 中列 -->
            <div class="cx_col">
                <div class="cx_panel" style="flex:2.2">
                    <h3>🌍 全球用户分布 & 实时数据链路 <span>GLOBE 3D</span></h3>
                    <div class="cx_chart" id="cx_globe"></div>
                </div>
                <div class="cx_panel" style="flex:1">
                    <h3>实时访问 QPS <span>REAL-TIME</span></h3>
                    <div class="cx_chart" id="cx_qps"></div>
                </div>
            </div>

            <!-- 右列 -->
            <div class="cx_col">
                <div class="cx_panel" style="flex:1.1">
                    <h3>热门地域 TOP 10 <span>RANKING</span></h3>
                    <ul class="cx_rank" id="cx_rankList"></ul>
                </div>
                <div class="cx_panel" style="flex:0.9">
                    <h3>渠道转化漏斗 <span>FUNNEL</span></h3>
                    <div class="cx_chart" id="cx_funnel"></div>
                </div>
                <div class="cx_panel" style="flex:1">
                    <h3>小时活跃度 <span>HEAT MAP</span></h3>
                    <div class="cx_chart" id="cx_heat"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function () {
        function cx_init(id) { return echarts.init(document.getElementById(id), null, { renderer: 'canvas' }); }

        // ---- 顶部时钟 ----
        setInterval(function () {
            var d = new Date();
            document.getElementById('cx_time').textContent =
                d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') +
                ' ' + d.toTimeString().slice(0,8);
        }, 1000);

        // ---- 1. 设备来源饼图 ----
        var cx_pieChart = cx_init('cx_pie');
        cx_pieChart.setOption({
            backgroundColor: 'transparent',
            tooltip: { trigger: 'item', formatter: '{b}<br/>{d}%', backgroundColor: 'rgba(15,32,39,0.9)', borderColor: '#00d4ff', textStyle: { color: '#fff' } },
            legend: { bottom: 0, textStyle: { color: '#94a3b8', fontSize: 11 }, itemGap: 10 },
            series: [{
                type: 'pie', radius: ['42%', '70%'], center: ['50%', '45%'],
                itemStyle: { borderColor: '#0b1a2a', borderWidth: 2, borderRadius: 4 },
                label: { color: '#94a3b8', fontSize: 11 },
                data: [
                    { value: 45620, name: '手机', itemStyle: { color: '#00d4ff' } },
                    { value: 32180, name: 'PC',   itemStyle: { color: '#a78bfa' } },
                    { value: 18340, name: '平板', itemStyle: { color: '#51cf66' } },
                    { value: 8920,  name: '其他', itemStyle: { color: '#ffa94d' } }
                ]
            }]
        });

        // ---- 2. 仪表盘 ----
        var cx_gaugeChart = cx_init('cx_gauge');
        cx_gaugeChart.setOption({
            backgroundColor: 'transparent',
            series: [{
                type: 'gauge', radius: '85%', center: ['50%', '58%'],
                startAngle: 220, endAngle: -40,
                min: 0, max: 100, splitNumber: 10,
                progress: { show: true, width: 10, roundCap: true },
                axisLine: { lineStyle: { width: 10, color: [[0.6, '#ef4444'], [0.8, '#f59e0b'], [1, '#00d4ff']] } },
                pointer: { show: false },
                axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false },
                anchor: { show: false },
                detail: {
                    valueAnimation: true, formatter: '{value}%', offsetCenter: [0, '0%'],
                    fontSize: 28, fontWeight: 'bold', color: '#00d4ff'
                },
                title: { offsetCenter: [0, '40%'], fontSize: 12, color: '#94a3b8' },
                data: [{ value: 98.2, name: '在线率' }]
            }]
        });

        // ---- 3. 营收柱状图 ----
        var cx_barChart = cx_init('cx_bar');
        cx_barChart.setOption({
            backgroundColor: 'transparent',
            grid: { left: 36, right: 10, top: 18, bottom: 24 },
            xAxis: {
                type: 'category',
                data: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
                axisLine: { lineStyle: { color: '#334155' } },
                axisLabel: { color: '#64748b', fontSize: 10 }
            },
            yAxis: {
                type: 'value',
                axisLine: { show: false }, splitLine: { lineStyle: { color: '#1e293b' } },
                axisLabel: { color: '#64748b', fontSize: 10 }
            },
            tooltip: { trigger: 'axis', backgroundColor: 'rgba(15,32,39,0.9)', borderColor: '#00d4ff', textStyle: { color: '#fff' } },
            series: [{
                type: 'bar', barWidth: 10,
                itemStyle: {
                    borderRadius: [4,4,0,0],
                    color: new echarts.graphic.LinearGradient(0,0,0,1,[
                        { offset: 0, color: '#00d4ff' }, { offset: 1, color: '#0ea5e9' }
                    ])
                },
                data: [180,195,220,250,280,310,290,330,360,390,420,460]
            }]
        });

        // ---- 4. Globe3D 地球 ----
        var cx_globeChart = cx_init('cx_globe');
        var CX_R = 100;
        var cx_worldCities = [
            { name: '北京',     lon: 116.4, lat: 39.9, pop: 2100 },
            { name: '上海',     lon: 121.5, lat: 31.2, pop: 2400 },
            { name: '东京',     lon: 139.7, lat: 35.7, pop: 3700 },
            { name: '首尔',     lon: 126.9, lat: 37.6, pop: 980  },
            { name: '新加坡',   lon: 103.8, lat: 1.3,  pop: 570  },
            { name: '迪拜',     lon: 55.3,  lat: 25.3, pop: 330  },
            { name: '莫斯科',   lon: 37.6,  lat: 55.8, pop: 1250 },
            { name: '巴黎',     lon: 2.35,  lat: 48.9, pop: 2200 },
            { name: '伦敦',     lon: -0.12, lat: 51.5, pop: 890  },
            { name: '纽约',     lon: -74.0, lat: 40.7, pop: 8600 },
            { name: '洛杉矶',   lon: -118.2,lat: 34.0, pop: 4000 },
            { name: '悉尼',     lon: 151.2, lat: -33.9,pop: 530  },
            { name: '孟买',     lon: 72.8,  lat: 19.1, pop: 1800 },
            { name: '圣保罗',   lon: -46.6, lat: -23.5,pop: 2200 }
        ];
        var cx_cityMap = {};
        cx_worldCities.forEach(function(c){ cx_cityMap[c.name] = c; });
        function cx_arcLine(lon1,lat1,lon2,lat2,segs){
            segs = segs||18; var out=[];
            for(var i=0;i<=segs;i++){
                var t=i/segs, ml=lon1+(lon2-lon1)*t, ma=lat1+(lat2-lat1)*t;
                var bulge=Math.sin(t*Math.PI)*0.35;
                out.push([ml, ma, 1.5+bulge*8]);
            }
            return out;
        }
        var cx_flightPairs = [
            ['北京','纽约'],['北京','伦敦'],['上海','悉尼'],['东京','洛杉矶'],
            ['新加坡','巴黎'],['迪拜','孟买'],['莫斯科','首尔'],['洛杉矶','东京'],
            ['伦敦','纽约'],['悉尼','洛杉矶'],['圣保罗','巴黎'],['北京','新加坡']
        ];
        var cx_flightLines = cx_flightPairs.map(function(p){
            var a=cx_cityMap[p[0]], b=cx_cityMap[p[1]];
            return { coords: cx_arcLine(a.lon,a.lat,b.lon,b.lat) };
        });
        var cx_cityPoints = cx_worldCities.map(function(c){
            return { name: c.name, value: [c.lon, c.lat, 2, c.pop] };
        });

        cx_globeChart.setOption({
            backgroundColor: 'transparent',
            tooltip: { backgroundColor: 'rgba(15,32,39,0.9)', borderColor: '#00d4ff', textStyle: { color: '#fff' } },
            globe: {
                radius: CX_R,
                globeOuterRadius: CX_R + 1,
                shading: 'realistic',
                realisticMaterial: { color: '#0a3d62', roughness: 0.9, metalness: 0 },
                light: {
                    main: { intensity: 1.2, shadow: true, shadowQuality: 'high', alpha: 40, beta: 40 },
                    ambient: { intensity: 0.35 }
                },
                viewControl: {
                    autoRotate: true, distance: 220, alpha: 20,
                    panMouseButton: 'left', rotateMouseButton: 'right'
                },
                postEffect: {
                    enable: true,
                    SSAO: { enable: true, quality: 'medium', radius: 2 },
                    bloom: { enable: true, bloomIntensity: 0.3 }
                }
            },
            series: [
                {
                    name: '城市', type: 'scatterGL', coordinateSystem: 'globe',
                    symbolSize: function(val){ return Math.max(5, Math.min(14, val[3]/500)); },
                    itemStyle: {
                        color: function(p){
                            var v=p.data.value[3];
                            if(v>5000) return '#ff6b6b';
                            if(v>2000) return '#ffd43b';
                            if(v>800)  return '#51cf66';
                            return '#00d4ff';
                        }
                    },
                    label: { show: true, position: 'right', formatter: '{b}', color: '#fff', fontSize: 10 },
                    data: cx_cityPoints
                },
                {
                    name: '数据链路', type: 'linesGL', coordinateSystem: 'globe',
                    effect: { show: true, trailLength: 0.25, period: 5, symbolSize: 3, color: '#fff' },
                    blendMode: 'lighter',
                    lineStyle: { width: 1, opacity: 0.6, color: '#00d4ff', curveness: 0.3 },
                    data: cx_flightLines
                }
            ]
        });

        // ---- 5. 实时 QPS 折线 ----
        var cx_qpsChart = cx_init('cx_qps');
        var cx_qpsData = [], cx_qpsTime = [];
        for (var i = 29; i >= 0; i--) {
            cx_qpsTime.push(i + 's');
            cx_qpsData.push(Math.round(800 + Math.random()*400));
        }
        cx_qpsChart.setOption({
            backgroundColor: 'transparent',
            grid: { left: 44, right: 20, top: 18, bottom: 26 },
            tooltip: { trigger: 'axis', backgroundColor: 'rgba(15,32,39,0.9)', borderColor: '#00d4ff', textStyle: { color: '#fff' } },
            xAxis: {
                type: 'category', data: cx_qpsTime.slice(), boundaryGap: false,
                axisLine: { lineStyle: { color: '#334155' } },
                axisLabel: { color: '#64748b', fontSize: 10, interval: 4 }
            },
            yAxis: {
                type: 'value', min: 0,
                axisLine: { show: false }, splitLine: { lineStyle: { color: '#1e293b' } },
                axisLabel: { color: '#64748b', fontSize: 10 }
            },
            series: [{
                type: 'line', smooth: true,
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0,0,0,1,[
                        { offset: 0, color: 'rgba(0,212,255,0.5)' },
                        { offset: 1, color: 'rgba(0,212,255,0.02)' }
                    ])
                },
                lineStyle: { color: '#00d4ff', width: 2 },
                itemStyle: { color: '#00d4ff' },
                showSymbol: false,
                data: cx_qpsData.slice()
            }]
        });
        setInterval(function () {
            cx_qpsData.shift();
            cx_qpsData.push(Math.round(800 + Math.random()*400));
            cx_qpsChart.setOption({
                xAxis: { data: cx_qpsTime },
                series: [{ data: cx_qpsData }]
            });
        }, 1500);

        // ---- 6. TOP 10 排行榜 ----
        var cx_rankData = [
            { name: '广东', val: 128600 }, { name: '江苏', val: 105400 },
            { name: '浙江', val: 98200 },  { name: '山东', val: 84300 },
            { name: '四川', val: 72100 },  { name: '河南', val: 68500 },
            { name: '湖北', val: 59800 },  { name: '福建', val: 54200 },
            { name: '湖南', val: 48600 },  { name: '安徽', val: 42300 }
        ];
        var cx_rankHtml = cx_rankData.map(function (r, i) {
            var pct = (r.val / cx_rankData[0].val * 100).toFixed(0);
            return '<li><i>'+(i+1)+'</i><span class="cx_name">'+r.name+'</span>' +
                   '<div class="cx_bar"><span style="width:'+pct+'%"></span></div>' +
                   '<span class="cx_val">'+(r.val/10000).toFixed(2)+'万</span></li>';
        }).join('');
        document.getElementById('cx_rankList').innerHTML = cx_rankHtml;

        // ---- 7. 漏斗 ----
        var cx_funnelChart = cx_init('cx_funnel');
        cx_funnelChart.setOption({
            backgroundColor: 'transparent',
            tooltip: { trigger: 'item', backgroundColor: 'rgba(15,32,39,0.9)', borderColor: '#00d4ff', textStyle: { color: '#fff' } },
            series: [{
                type: 'funnel', left: 10, right: 10, top: 10, bottom: 10,
                minSize: '15%', maxSize: '95%', gap: 2,
                label: { color: '#cbd5e1', fontSize: 11 },
                itemStyle: { borderColor: '#0b1a2a', borderWidth: 1 },
                data: [
                    { value: 100000, name: '曝光', itemStyle: { color: '#00d4ff' } },
                    { value: 68000,  name: '点击', itemStyle: { color: '#38bdf8' } },
                    { value: 42000,  name: '访问', itemStyle: { color: '#a78bfa' } },
                    { value: 22000,  name: '咨询', itemStyle: { color: '#f472b6' } },
                    { value: 8600,   name: '成交', itemStyle: { color: '#ff6b6b' } }
                ]
            }]
        });

        // ---- 8. 小时活跃度热力 ----
        var cx_heatChart = cx_init('cx_heat');
        var cx_hours = [], cx_days = ['周一','周二','周三','周四','周五','周六','周日'];
        for (var h = 0; h < 24; h++) cx_hours.push(h + ':00');
        var cx_heatData = [];
        for (var d = 0; d < 7; d++) {
            for (var h = 0; h < 24; h++) {
                var base = 10 + Math.sin(h/4) * 30 + (h>=9&&h<=22 ? 40 : 0) + Math.random()*15;
                if (d >= 5 && h >= 10 && h <= 23) base += 25;
                cx_heatData.push([h, d, Math.round(base)]);
            }
        }
        cx_heatChart.setOption({
            backgroundColor: 'transparent',
            tooltip: { backgroundColor: 'rgba(15,32,39,0.9)', borderColor: '#00d4ff', textStyle: { color: '#fff' } },
            grid: { left: 44, right: 10, top: 10, bottom: 30 },
            xAxis: {
                type: 'category', data: cx_hours, splitArea: { show: true },
                axisLine: { lineStyle: { color: '#334155' } },
                axisLabel: { color: '#64748b', fontSize: 9, interval: 3 }
            },
            yAxis: {
                type: 'category', data: cx_days, splitArea: { show: true },
                axisLine: { lineStyle: { color: '#334155' } },
                axisLabel: { color: '#64748b', fontSize: 10 }
            },
            visualMap: {
                min: 0, max: 100, calculable: true, show: false,
                inRange: { color: ['#0b1a2a', '#0891b2', '#00d4ff', '#a78bfa', '#ff6b6b'] }
            },
            series: [{
                type: 'heatmap', data: cx_heatData,
                label: { show: false },
                emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.5)' } }
            }]
        });

        // ---- 自适应 ----
        var cx_charts = [cx_pieChart, cx_gaugeChart, cx_barChart, cx_globeChart, cx_qpsChart, cx_funnelChart, cx_heatChart];
        window.addEventListener('resize', function () {
            cx_charts.forEach(function(c){ c.resize(); });
        });

        // ---- 指标模拟 ----
        setInterval(function () {
            var s1 = (120 + Math.random()*20).toFixed(1);
            var s2 = (96 + Math.random()*3).toFixed(1);
            var s3 = (30 + Math.random()*40).toFixed(0);
            document.getElementById('cx_stat1').textContent = s1 + '万';
            document.getElementById('cx_stat2').textContent = s2 + '%';
            document.getElementById('cx_stat3').textContent = s3 + 'ms';
            cx_gaugeChart.setOption({ series: [{ data: [{ value: parseFloat(s2), name: '在线率' }] }] });
        }, 3000);
    })();
    </script>
</body>
</html>
