 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* 全局css */
    *{margin: 0;padding: 0;}
    ul{list-style: none;}
    .slist{ 
        display: flex;
        flex-wrap: wrap;
    }
    .slist li{
        width: 30%;
        margin-right:3px;
        flex-grow: 1;
    }
    .slist img{ 
        width: 100%;
    }
    .slist p{ 
        text-align: center;
        font-size: 14px;
        color: rgb(27, 228, 222);
        line-height: 30px;
        }
</style>
<body>
    <ul class="slist"> 
        <li>
            <img src="./img/1.jpg">
            <p>陈曦的标题1</p>
        </li>
        <li>
            <img src="./img/2.jpg">
            <p>陈曦的标题2</p>
        </li>
        <li>
            <img src="./img/3.jpg">
            <p>陈曦的标题3</p>
        </li>
    </ul>
</body>
</html>
