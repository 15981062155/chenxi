<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>18-3 SVG 智能客服架构图 - 陈曦</title>
    <style>
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 28px 16px;
            background: linear-gradient(135deg, #f5f0ff 0%, #fff 60%, #f0f5ff 100%);

            font-size: 12px;

        .cx_svg-wrap {
            display: inline-block;

        svg {

<body>
    <h1>基于知识库的智能客服系统架构</h1>
    <p class="cx_subtitle">Knowledge-Based Intelligent Customer Service Architecture · 科研方向</p>
    <p class="cx_author">姓名：陈曦 · 18-3 · SVG 绘制</p>

    <div class="cx_svg-wrap">
        <svg viewBox="0 0 1200 940" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="gUser" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#b39ddb"/>
                    <stop offset="100%" stop-color="#7e57c2"/>

                <linearGradient id="gInput" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ce93d8"/>
                    <stop offset="100%" stop-color="#ab47bc"/>
                </linearGradient>
                <linearGradient id="gNlp" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#9575cd"/>
                    <stop offset="100%" stop-color="#5e35b1"/>
                </linearGradient>
                <linearGradient id="gKb" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#81d4fa"/>
                    <stop offset="100%" stop-color="#0288d1"/>
                </linearGradient>
                <linearGradient id="gLlm" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#80deea"/>
                    <stop offset="100%" stop-color="#00838f"/>
                </linearGradient>
                <linearGradient id="gDialog" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#a5d6a7"/>
                    <stop offset="100%" stop-color="#2e7d32"/>
                </linearGradient>
                <linearGradient id="gOutput" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffab91"/>
                    <stop offset="100%" stop-color="#e64a19"/>
                </linearGradient>
                <linearGradient id="gEval" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffe082"/>
                    <stop offset="100%" stop-color="#f9a825"/>
                </linearGradient>
                <linearGradient id="gData" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#90a4ae"/>
                    <stop offset="100%" stop-color="#455a64"/>

                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5e35b1"/>
                </marker>
                <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"

                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0288d1"/>
                </marker>
                <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5"
                        markerWidth="7" markerHeight="7" orient="auto-start-reverse">

                </marker>
                <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"

                <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5"

            <rect x="40" y="820" width="1120" height="95" rx="12" fill="#eceff1" stroke="#90a4ae" stroke-dasharray="5,3"/>
            <text x="60" y="842" fill="#455a64" font-size="12" font-weight="bold" font-family="PingFang SC">【数据底座 Data Infrastructure】</text>

            <!-- 离线训练 & 评测 -->
            <rect x="40" y="695" width="1120" height="100" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-dasharray="5,3"/>
            <text x="60" y="717" fill="#f57f17" font-size="12" font-weight="bold" font-family="PingFang SC">【离线迭代闭环 Offline Evaluation & Fine-tuning】</text>

            <!-- ====== 第 1 层：用户 ====== -->
            <g filter="url(#shadow)">
                <rect x="520" y="30" width="160" height="60" rx="10" fill="url(#gUser)"/>
                <text x="600" y="55" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle" font-family="PingFang SC">👤 用户</text>
                <text x="600" y="75" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">Web / App / 小程序 / 语音</text>
            </g>

            <!-- 用户输入 → 多模态 -->
            <line x1="600" y1="90" x2="600" y2="130" stroke="#7e57c2" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ====== 第 2 层：输入处理 ====== -->
            <g filter="url(#shadow)">
                <rect x="360" y="130" width="480" height="55" rx="10" fill="url(#gInput)"/>
                <text x="600" y="155" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle" font-family="PingFang SC">多模态输入处理 · Multimodal Input Processor</text>
                <text x="600" y="172" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">ASR 语音转文字 · OCR 图像识别 · 用户画像注入</text>
            </g>

            <!-- → NLU -->
            <line x1="600" y1="185" x2="600" y2="230" stroke="#ab47bc" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- ====== 第 3 层：NLP / 语义理解 ====== -->
            <g filter="url(#shadow)">
                <rect x="80" y="230" width="320" height="110" rx="10" fill="url(#gNlp)"/>
                <text x="240" y="258" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle" font-family="PingFang SC">语义理解模块 NLU</text>
                <text x="240" y="280" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">意图识别 Intent</text>
                <text x="240" y="296" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">实体抽取 Slot Filling</text>
                <text x="240" y="312" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">情感分析 Sentiment</text>

            <g filter="url(#shadow)">
                <rect x="440" y="230" width="320" height="110" rx="10" fill="url(#gNlp)"/>

                <text x="600" y="280" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">多轮对话历史 Memory</text>
                <text x="600" y="296" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">Session 会话状态</text>
                <text x="600" y="312" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">知识注入 Prompt Engineering</text>
            </g>
            <g filter="url(#shadow)">
                <rect x="800" y="230" width="320" height="110" rx="10" fill="url(#gNlp)"/>
                <text x="960" y="258" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle" font-family="PingFang SC">对话策略 Policy</text>
                <text x="960" y="280" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">话术选择 / 追问决策</text>
                <text x="960" y="296" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">澄清 / 兜底 / 转人工</text>
                <text x="960" y="312" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">强化学习 RL 策略优化</text>
            </g>

            <!-- NLU → 知识库 -->
            <line x1="400" y1="285" x2="280" y2="355" stroke="#5e35b1" stroke-width="2" marker-end="url(#arrowBlue)"/>
            <!-- Context → LLM -->
            <line x1="600" y1="340" x2="600" y2="405" stroke="#5e35b1" stroke-width="2" marker-end="url(#arrowTeal)"/>
            <!-- Policy → LLM -->
            <line x1="880" y1="285" x2="820" y2="355" stroke="#5e35b1" stroke-width="2" marker-end="url(#arrowTeal)"/>

            <!-- ====== 第 4 层：知识库 + LLM ====== -->
            <g filter="url(#shadow)">
                <rect x="60" y="405" width="440" height="110" rx="10" fill="url(#gKb)"/>
                <text x="280" y="435" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle" font-family="PingFang SC">📚 知识库 Knowledge Base</text>
                <text x="280" y="457" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">向量数据库 · Faiss / Milvus / Pinecone</text>

                <text x="280" y="489" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">知识图谱 Graph Schema · 规则引擎 Rules</text>

                <text x="810" y="612" fill="rgba(255,255,255,0.85)" font-size="11" text-anchor="middle" font-family="PingFang SC">后处理 · 敏感词过滤 · 事实核验 · 拒答兜底</text>
            </g>

            <!-- → 返回用户 -->
            <path d="M 990 597 L 1100 597 L 1100 60 L 680 60" fill="none" stroke="#e64a19" stroke-width="2" marker-end="url(#arrowOrange)" stroke-dasharray="6,3"/>
            <text x="1040" y="585" fill="#e64a19" font-size="10" font-family="PingFang SC">📤 返回答案</text>

            <line x1="810" y1="630" x2="810" y2="695" stroke="#e64a19" stroke-width="2" marker-end="url(#arrowAmber)"/>

            <!-- ====== 离线评测层 ====== -->
            <g filter="url(#shadow)">
                <rect x="70" y="705" width="280" height="75" rx="10" fill="url(#gEval)"/>
                <text x="210" y="731" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="PingFang SC">反馈收集 Feedback</text>
                <text x="210" y="750" fill="rgba(255,255,255,0.9)" font-size="10.5" text-anchor="middle" font-family="PingFang SC">点赞 / 点踩 · 转人工标签 · Bad Case 收集</text>
                <text x="210" y="764" fill="rgba(255,255,255,0.9)" font-size="10.5" text-anchor="middle" font-family="PingFang SC">对抗样本挖掘 Adversarial</text>
            </g>
            <g filter="url(#shadow)">
                <rect x="380" y="705" width="280" height="75" rx="10" fill="url(#gEval)"/>
                <text x="520" y="731" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="PingFang SC">自动评测 Benchmark</text>
                <text x="520" y="750" fill="rgba(255,255,255,0.9)" font-size="10.5" text-anchor="middle" font-family="PingFang SC">ROUGE / BLEU / BERTScore</text>
                <text x="520" y="764" fill="rgba(255,255,255,0.9)" font-size="10.5" text-anchor="middle" font-family="PingFang SC">LLM-as-Judge · 领域问答集</text>
            </g>
            <g filter="url(#shadow)">
                <rect x="690" y="705" width="280" height="75" rx="10" fill="url(#gEval)"/>
                <text x="830" y="731" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="PingFang SC">模型优化 Fine-tune</text>
                <text x="830" y="750" fill="rgba(255,255,255,0.9)" font-size="10.5" text-anchor="middle" font-family="PingFang SC">SFT 监督微调 · RLHF 人类反馈强化</text>
                <text x="830" y="764" fill="rgba(255,255,255,0.9)" font-size="10.5" text-anchor="middle" font-family="PingFang SC">LoRA / Prompt Tuning 参数高效</text>
            </g>
            <g filter="url(#shadow)">
                <rect x="1000" y="705" width="140" height="75" rx="10" fill="url(#gEval)"/>
                <text x="1070" y="731" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="PingFang SC">A/B 实验</text>
                <text x="1070" y="750" fill="rgba(255,255,255,0.9)" font-size="10.5" text-anchor="middle" font-family="PingFang SC">在线流量对比</text>
                <text x="1070" y="764" fill="rgba(255,255,255,0.9)" font-size="10.5" text-anchor="middle" font-family="PingFang SC">灰度发布</text>
            </g>

            <!-- 评测 → LLM (反馈闭环) -->
            <path d="M 520 705 L 520 650 L 710 650 L 710 515" fill="none" stroke="#f9a825" stroke-width="2" marker-end="url(#arrowAmber)" stroke-dasharray="6,3"/>
            <text x="620" y="643" fill="#f57f17" font-size="10" font-family="PingFang SC" text-anchor="middle" font-weight="bold">↑ 反馈迭代更新</text>

            <!-- 评测 → 知识库 -->
            <path d="M 210 705 L 210 600 L 380 600 L 380 515" fill="none" stroke="#f9a825" stroke-width="1.5" marker-end="url(#arrowAmber)" stroke-dasharray="6,3" opacity="0.7"/>

            <!-- ====== 数据底座 ====== -->
            <g filter="url(#shadow)">
                <rect x="70" y="830" width="260" height="70" rx="10" fill="url(#gData)"/>
                <text x="200" y="855" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" font-family="PingFang SC">📖 原始语料</text>
                <text x="200" y="873" fill="rgba(255,255,255,0.85)" font-size="10.5" text-anchor="middle" font-family="PingFang SC">FAQ · 工单日志 · 产品手册 · 对话日志</text>
            </g>
            <g filter="url(#shadow)">
                <rect x="370" y="830" width="260" height="70" rx="10" fill="url(#gData)"/>
                <text x="500" y="855" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" font-family="PingFang SC">🧹 数据治理</text>
                <text x="500" y="873" fill="rgba(255,255,255,0.85)" font-size="10.5" text-anchor="middle" font-family="PingFang SC">清洗 · 去重 · 脱敏 · 标注 · 切分</text>
            </g>
            <g filter="url(#shadow)">
                <rect x="670" y="830" width="260" height="70" rx="10" fill="url(#gData)"/>
                <text x="800" y="855" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" font-family="PingFang SC">🗄 存储计算</text>
                <text x="800" y="873" fill="rgba(255,255,255,0.85)" font-size="10.5" text-anchor="middle" font-family="PingFang SC">MySQL · HDFS · GPU 集群 · Kubernetes</text>
            </g>
            <g filter="url(#shadow)">
                <rect x="970" y="830" width="170" height="70" rx="10" fill="url(#gData)"/>
                <text x="1055" y="855" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" font-family="PingFang SC">📊 监控</text>
                <text x="1055" y="873" fill="rgba(255,255,255,0.85)" font-size="10.5" text-anchor="middle" font-family="PingFang SC">Prometheus · Grafana</text>
            </g>

            <!-- 数据底座 → 知识库 -->
            <line x1="200" y1="830" x2="200" y2="515" stroke="#455a64" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
            <!-- 数据底座 → LLM -->
            <line x1="800" y1="830" x2="800" y2="515" stroke="#455a64" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>

            <!-- 标题角标 -->
            <text x="1140" y="28" fill="#5e35b1" font-size="10" font-family="PingFang SC" text-anchor="end">SVG · 18-3 · 陈曦</text>
        </svg>

        <div class="cx_legend">
            <span><i style="background:#7e57c2"></i> 用户 / 输入层</span>
