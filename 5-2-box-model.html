<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型、框模型 box</title>
    <style>
        body,ul,p,h1,h2,h3,h4,h5,h6{
            margin: 0;
            padding: 0;
        }
        .a {
            width: 500px;
            height: 300px;
            border: 2px dotted blue;
            padding: 70px 60px 50px 40px;/*内边距*/
            margin: 40px auto;/*外边距*/
        }
        .b {
            width: 500px;
            height: 300px;
            border: 2px dashed blue;
            margin: 50px auto 40px;/*外边距*/
        }
        .c {
            width: 300px;
            height: 200px;
            border: 2px solid blue;
            padding: 2px;
            margin: 40px auto;
}

    </style>
</head>
<body>
    <div class="a">121陈曦</div>
    <div class="b">121陈曦</div>
    <div class="c">121陈曦</div>
</body>
</html>
