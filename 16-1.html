        /* 新增：从右侧滑入（push） */

        .cx_cell-new-r { animation: cx_inRight .55s ease-out; }

<body>
    <h1>JavaScript 数组常用方法图解</h1>
    <p class="cx_author">姓名：陈曦 · 第 16 章 · 23 个数组方法，看图就懂</p>

    <div class="cx_container">

        <!-- 控制台 -->
        <div class="cx_bar">
            <label>演示数组：</label>
            <input id="cx_input" value="5, 2, 9, 1, 7, 4">
            <button class="cx_btn" id="cx_apply">应用</button>
            <button class="cx_btn cx_btn-light" id="cx_reset">重置</button>
            <button class="cx_btn cx_btn-play" id="cx_replayAll">全部重播动画</button>
        </div>

        <!-- 当前数组总览 -->
        <div class="cx_board">
            <div class="cx_board-title">当前数组（下方所有演示都基于它，每个方法都会先复制一份再操作）</div>
            <div class="cx_arr" id="cx_boardArr"></div>
            <div class="cx_len" id="cx_boardLen"></div>
        </div>

        <div id="cx_parts"></div>

        <!-- 速查表 -->
        <div class="cx_part">
            <h2>五、方法速查表</h2>
            <p class="cx_part-desc">红色标记的方法会直接修改原数组，使用时要注意。</p>
            <table>
                <thead>
                    <tr>
                        <th>方法</th>
                        <th>作用</th>
                        <th>改变原数组</th>
                        <th>返回值</th>
                    </tr>
                </thead>
                <tbody id="cx_tableBody"></tbody>
            </table>
        </div>

    </div>

    <script>
        /* =========================================================
           陈曦 · 16-1  JavaScript 数组方法图解
           ========================================================= */

        var CX_DEFAULT = [5, 2, 9, 1, 7, 4];
        var cx_main = CX_DEFAULT.slice();

        /* ---------- 工具：把值显示成文字 ---------- */
        function cx_show(v) {
            if (Array.isArray(v)) {
                return "[" + v.map(cx_show).join(", ") + "]";
            }
            if (v === null) return "null";
            if (typeof v === "string") return '"' + v + '"';
            if (typeof v === "undefined") return "undefined";
            return String(v);
        }

        function cx_esc(s) {
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        /* ---------- 工具：代码高亮 ---------- */
        function cx_hl(src) {
            var re = /(\/\/[^\n]*)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(var|let|const|function|return|if|else|for|of|in|new|true|false|null|undefined)\b|\b(\d+)\b/g;
            var out = "", last = 0, m;
            while ((m = re.exec(src)) !== null) {
                out += cx_esc(src.slice(last, m.index));
                if (m[1]) out += '<span class="cx_c">' + cx_esc(m[1]) + '</span>';
                else if (m[2]) out += '<span class="cx_s">' + cx_esc(m[2]) + '</span>';
                else if (m[3]) out += '<span class="cx_k">' + cx_esc(m[3]) + '</span>';
                else out += '<span class="cx_n">' + cx_esc(m[4]) + '</span>';
                last = m.index + m[0].length;
            }
            out += cx_esc(src.slice(last));
            return out;
        }

        /* ---------- 工具：渲染一行数组方块 ---------- */
        function cx_renderCells(box, arr, opt) {
            opt = opt || {};
            box.innerHTML = "";
            if (!arr || arr.length === 0) {
                box.innerHTML = '<span class="cx_empty">[ ] 空数组</span>';
                return;
            }
            for (var i = 0; i < arr.length; i++) {
                var cell = document.createElement("div");
                cell.className = "cx_cell";
                if (opt.hitIdx && opt.hitIdx.indexOf(i) >= 0) cell.className += " cx_cell-hit";
                if (opt.delIdx && opt.delIdx.indexOf(i) >= 0) cell.className += " cx_cell-del";
                if (opt.newIdx && opt.newIdx.indexOf(i) >= 0) {
                    cell.className += (opt.newFrom === "left") ? " cx_cell-new-l" : " cx_cell-new-r";
                }
                if (opt.allNew) cell.className += " cx_cell-new";
                if (opt.allMove) cell.className += " cx_cell-move";
                cell.innerHTML = "<b>" + cx_esc(cx_show(arr[i])) + "</b><i>" + i + "</i>";
                box.appendChild(cell);
            }
        }

        /* =========================================================
           方法数据：每个 run(arr) 返回演示结果
           ========================================================= */
        var cx_parts = [
            {
                title: "一、会修改原数组的方法",
                desc: "这些方法直接在原数组上动手脚，操作后原数组本身就变了。",
                methods: [
                    {
                        name: "push()",
                        mut: true,
                        desc: "在数组末尾添加一个或多个元素。",
                        variants: [{
                            label: "push(10)",
                            code: "var a = [5, 2, 9, 1, 7, 4];\nvar len = a.push(10);   // 返回新长度\n// a → [5, 2, 9, 1, 7, 4, 10]",
                            run: function (a) {
                                var before = a.slice();
                                var ret = a.push(10);
                                return {
                                    before: before, after: a, ret: ret,
                                    delIdx: [], newIdx: [a.length - 1], newFrom: "right",
                                    changed: true, retKind: "value", retTitle: "返回值",
                                    retSub: "（添加后数组的新长度）"
                                };
                            }
                        }]
                    },
                    {
                        name: "pop()",
                        mut: true,
                        desc: "删除并返回数组的最后一个元素。",
                        variants: [{
                            label: "pop()",
                            code: "var a = [5, 2, 9, 1, 7, 4];\nvar last = a.pop();    // 返回被删的元素 4\n// a → [5, 2, 9, 1, 7]",
                            run: function (a) {
                                var before = a.slice();
                                var ret = a.pop();
                                return {
                                    before: before, after: a, ret: ret,
                                    delIdx: [before.length - 1], newIdx: [],
                                    changed: true, retKind: "value", retTitle: "返回值",
                                    retSub: "（被删掉的最后一个元素）", red: true
                                };
                            }
                        }]
                    },
                    {
                        name: "unshift()",
                        mut: true,
                        desc: "在数组开头添加一个或多个元素，其余元素依次后移。",
                        variants: [{
                            label: "unshift(0)",
                            code: "var a = [5, 2, 9, 1, 7, 4];\nvar len = a.unshift(0); // 返回新长度 7\n// a → [0, 5, 2, 9, 1, 7, 4]",
                            run: function (a) {
                                var before = a.slice();
                                var ret = a.unshift(0);
                                return {
                                    before: before, after: a, ret: ret,
                                    delIdx: [], newIdx: [0], newFrom: "left",
                                    changed: true, retKind: "value", retTitle: "返回值",
                                    retSub: "（添加后数组的新长度）"
                                };
                            }
                        }]
                    },
                    {
                        name: "shift()",
                        mut: true,
                        desc: "删除并返回数组的第一个元素，其余元素依次前移。",
                        variants: [{
                            label: "shift()",
                            code: "var a = [5, 2, 9, 1, 7, 4];\nvar first = a.shift(); // 返回被删的元素 5\n// a → [2, 9, 1, 7, 4]",
                            run: function (a) {
                                var before = a.slice();
                                var ret = a.shift();
                                return {
                                    before: before, after: a, ret: ret,
                                    delIdx: [0], newIdx: [],
                                    changed: true, retKind: "value", retTitle: "返回值",
                                    retSub: "（被删掉的第一个元素）", red: true
                                };
                            }
                        }]
                    },
                    {
                        name: "splice()",
                        mut: true,
                        desc: "数组界的“瑞士军刀”：splice(起始索引, 删除个数, 要插入的元素…)，能删、能插、能替换。",
                        variants: [
                            {
                                label: "删除：splice(3, 2)",
                                code: "var a = [5, 2, 9, 1, 7, 4];\nvar out = a.splice(3, 2);  // 从索引3开始删2个\n// a    → [5, 2, 9, 4]\n// out  → [1, 7]  被删掉的元素",
                                run: function (a) {
                                    var before = a.slice();
                                    var ret = a.splice(3, 2);
                                    return {
                                        before: before, after: a, ret: ret,
                                        delIdx: [3, 4], newIdx: [],
                                        changed: true, retKind: "array", retTitle: "被删除的元素",
                                        retSub: "（返回值是被删元素组成的新数组）", red: true
                                    };
                                }
                            },
                            {
                                label: "插入：splice(1, 0, 8)",
                                code: "var a = [5, 2, 9, 1, 7, 4];\nvar out = a.splice(1, 0, 8); // 删0个，插入8\n// a   → [5, 8, 2, 9, 1, 7, 4]\n// out → []  没删任何元素",
                                run: function (a) {
                                    var before = a.slice();
                                    var ret = a.splice(1, 0, 8);
                                    return {
                                        before: before, after: a, ret: ret,
                                        delIdx: [], newIdx: [1], newFrom: "left",
                                        changed: true, retKind: "array", retTitle: "被删除的元素",
                                        retSub: "（删了 0 个，所以是空数组）"
                                    };
                                }
                            },
                            {
                                label: "替换：splice(2, 1, 6)",
                                code: "var a = [5, 2, 9, 1, 7, 4];\nvar out = a.splice(2, 1, 6); // 删1个再插入6\n// a   → [5, 2, 6, 1, 7, 4]\n// out → [9]",
                                run: function (a) {
                                    var before = a.slice();
                                    var ret = a.splice(2, 1, 6);
                                    return {
                                        before: before, after: a, ret: ret,
                                        delIdx: [2], newIdx: [2], newFrom: "right",
                                        changed: true, retKind: "array", retTitle: "被删除的元素",
                                        retSub: "（先删后插，实现“替换”）", red: true
                                    };
                                }
                            }
                        ]
                    },
                    {

                                    var ret = a.reduce(function (acc, x) { return x > acc ? x : acc; });
                                    var steps = [], acc = a[0];
                                    steps.push(String(acc));
                                    for (var i = 1; i < a.length; i++) {
                                        acc = a[i] > acc ? a[i] : acc;
                                        steps.push("比较 " + a[i] + " → " + acc);
                                    }
                                    var mi = a.indexOf(ret);
                                    return {
                                        before: a.slice(), ret: ret, hitIdx: mi >= 0 ? [mi] : [],
                                        changed: false, retKind: "steps", retTitle: "比较过程",
                                        steps: steps,
                                        retSub: "最大值：" + cx_show(ret),
                                        showAfter: false
                                    };
                                }
                            },
                            {
                                label: "reduce(带初始值 10)",
                                code: "var a = [5, 2, 9, 1, 7, 4];\n// 第二个参数是初始值\nvar sum = a.reduce(function (acc, x) {\n    return acc + x;\n}, 10);\n// sum → 38",
                                run: function (a) {
                                    var ret = a.reduce(function (acc, x) { return acc + x; }, 10);
                                    var steps = ["初值 10"], acc = 10;
                                    for (var i = 0; i < a.length; i++) {
                                        acc = acc + a[i];
                                        steps.push("+" + a[i] + " → " + acc);
                                    }
                                    return {
                                        before: a.slice(), ret: ret, hitIdx: [],
                                        changed: false, retKind: "steps", retTitle: "累加过程",
                                        steps: steps,
                                        retSub: "最终结果：" + cx_show(ret) + "（10 + 28）",
                                        showAfter: false
                                    };
                                }
                            }
                        ]
                    },
                    {
                        name: "Array.isArray()",
                        mut: false,
                        desc: "判断一个值是不是数组（typeof 对数组只能得到 object，所以要靠它）。",
                        variants: [{
                            label: "isArray 判断",
                            code: "Array.isArray([5, 2, 9]);      // → true\nArray.isArray('hello');       // → false\ntypeof [5, 2, 9];             // → 'object' 看不出是数组",
                            run: function (a) {
                                var ret = Array.isArray(a);
                                return {
                                    before: a.slice(), ret: ret, hitIdx: [],
                                    changed: false, retKind: "value", retTitle: "返回值",
                                    retSub: "（数组 → true；typeof 只能得到 'object'）",
                                    showAfter: false
                                };
                            }
                        }]
                    }
                ]
            }
        ];

        /* =========================================================
           速查表数据
           ========================================================= */
        var cx_tableData = [
            ["push()", "末尾添加元素", "是", "新长度"],
            ["pop()", "删除最后一个元素", "是", "被删的元素"],
            ["unshift()", "开头添加元素", "是", "新长度"],
            ["shift()", "删除第一个元素", "是", "被删的元素"],
            ["splice()", "删除 / 插入 / 替换", "是", "被删元素组成的数组"],
            ["sort()", "排序（数字要传比较函数）", "是", "排序后的原数组"],
            ["reverse()", "颠倒顺序", "是", "反转后的原数组"],
            ["concat()", "拼接数组", "否", "拼接后的新数组"],
            ["slice()", "截取片段", "否", "截取出的新数组"],
            ["map()", "逐个映射加工", "否", "加工后的新数组"],
            ["filter()", "按条件筛选", "否", "筛选后的新数组"],
            ["flat()", "拍平嵌套数组", "否", "拍平后的新数组"],
            ["join()", "连成字符串", "否", "字符串"],
            ["indexOf()", "查找元素位置", "否", "索引，找不到为 -1"],
            ["lastIndexOf()", "从后往前查找位置", "否", "索引，找不到为 -1"],
            ["includes()", "是否包含某值", "否", "true / false"],
            ["find()", "找第一个满足条件的元素", "否", "元素，找不到为 undefined"],
            ["findIndex()", "找第一个满足条件的下标", "否", "索引，找不到为 -1"],
            ["some()", "是否有任意一个满足", "否", "true / false"],
            ["every()", "是否全部满足", "否", "true / false"],
            ["forEach()", "依次遍历执行回调", "否", "undefined"],
            ["reduce()", "归并成一个值", "否", "累加结果"],
            ["Array.isArray()", "判断是否为数组", "否", "true / false"]
        ];

        /* =========================================================
           渲染逻辑
           ========================================================= */

        // 渲染顶部总览
        function cx_renderBoard() {
            cx_renderCells(document.getElementById("cx_boardArr"), cx_main);
            document.getElementById("cx_boardLen").textContent =
                "length = " + cx_main.length +
                "   |   arr[0] = " + cx_show(cx_main[0]) +
                "   |   arr[arr.length-1] = " + cx_show(cx_main[cx_main.length - 1]);
        }

        // 渲染结果区
        function cx_renderRet(box, r) {
            box.innerHTML = "";
            if (r.retKind === "array") {
                var nb = document.createElement("div");
                nb.className = "cx_arr";
                box.appendChild(nb);
                cx_renderCells(nb, r.ret, { allNew: true });
            } else if (r.retKind === "steps") {
                var sw = document.createElement("div");
                sw.className = "cx_steps";
                for (var i = 0; i < r.steps.length; i++) {
                    var sp = document.createElement("span");
                    sp.textContent = r.steps[i];
                    sw.appendChild(sp);
                    if (i < r.steps.length - 1) {
                        var ar = document.createElement("b");
                        ar.textContent = "›";
                        sw.appendChild(ar);
                    }
                }
                box.appendChild(sw);
            } else if (r.retKind === "log") {
                var lg = document.createElement("div");
                lg.className = "cx_log";
                lg.textContent = r.log || "";
                box.appendChild(lg);
            } else {
                var chip = document.createElement("span");
                chip.className = "cx_chip" + (r.red ? " cx_chip-red" : (r.gray ? " cx_chip-gray" : ""));
                chip.textContent = cx_show(r.ret);
                box.appendChild(chip);
            }
            if (r.retSub) {
                var sub = document.createElement("span");
                sub.className = "cx_ret-txt";
                sub.textContent = " " + r.retSub;
                box.appendChild(sub);
            }
        }

        // 播放某个变体的动画
        function cx_play(card, method, vi) {
            var variant = method.variants[vi];
            var copy = cx_main.slice();
            var r = variant.run(copy);

            card.querySelector(".cx_code").innerHTML = cx_hl(variant.code);
            var noteEl = card.querySelector(".cx_note");
            if (r.note || variant.note) {
                noteEl.style.display = "block";
                noteEl.innerHTML = r.note || variant.note || "";
            } else {
                noteEl.style.display = "none";
            }

            // 操作前
            cx_renderCells(card.querySelector(".cx_before"), r.before,
                { delIdx: r.delIdx, hitIdx: r.hitIdx });

            // 操作后
            var afterLine = card.querySelector(".cx_afterLine");
            if (r.showAfter === false) {
                afterLine.style.display = "none";
            } else {
                afterLine.style.display = "flex";
                cx_renderCells(card.querySelector(".cx_after"), r.after,
                    { newIdx: r.newIdx, newFrom: r.newFrom, allMove: r.allMove });
                var flag = card.querySelector(".cx_flag");
                flag.textContent = r.changed ? "原数组已被修改" : "原数组未改变";
                flag.className = "cx_flag" + (r.changed ? "" : " cx_flag-no");
            }

            // 箭头说明
            card.querySelector(".cx_arrow").textContent = "↓ " + method.name;

            // 返回值
            card.querySelector(".cx_retTitle").textContent = r.retTitle || "返回值";
            cx_renderRet(card.querySelector(".cx_ret"), r);

            console.log("【" + method.name + "】" + variant.label + " → 返回：" + cx_show(r.ret));
        }

        // 构建所有卡片
        var cx_cards = [];

        function cx_build() {
            var host = document.getElementById("cx_parts");
            host.innerHTML = "";
            cx_cards = [];

            for (var p = 0; p < cx_parts.length; p++) {
                var part = cx_parts[p];
                var sec = document.createElement("div");
                sec.className = "cx_part";
                var h2 = document.createElement("h2");
                h2.textContent = part.title;
                sec.appendChild(h2);
                var pd = document.createElement("p");
                pd.className = "cx_part-desc";
                pd.textContent = part.desc;
                sec.appendChild(pd);
                var grid = document.createElement("div");
                grid.className = "cx_grid";

                for (var m = 0; m < part.methods.length; m++) {
                    var method = part.methods[m];
                    var card = document.createElement("div");
                    card.className = "cx_card";

                    var html = '<h3>' + method.name +
                        '<span class="cx_tag ' + (method.mut ? 'cx_tag-mut">会改原数组' : 'cx_tag-keep">不改原数组') +
                        '</span></h3>' +
                        '<p class="cx_desc">' + method.desc + '</p>' +
                        '<pre class="cx_code"></pre>' +
                        '<div class="cx_btns"></div>' +
                        '<div class="cx_line"><span class="cx_lt">操作前</span><div class="cx_arr cx_before"></div></div>' +
                        '<div class="cx_arrow"></div>' +
                        '<div class="cx_line cx_afterLine"><span class="cx_lt">操作后</span><div class="cx_arr cx_after"></div><span class="cx_flag"></span></div>' +
                        '<div class="cx_line"><span class="cx_lt cx_retTitle">返回值</span><div class="cx_ret"></div></div>' +
                        '<div class="cx_note"></div>';
                    card.innerHTML = html;

                    var btns = card.querySelector(".cx_btns");
                    (function (method, card) {
                        for (var v = 0; v < method.variants.length; v++) {
                            (function (vi) {
                                var b = document.createElement("button");
                                b.className = "cx_var" + (vi === 0 ? " cx_on" : "");
                                b.textContent = method.variants[vi].label;
                                b.onclick = function () {
                                    var all = btns.querySelectorAll(".cx_var");
                                    for (var k = 0; k < all.length; k++) all[k].className = "cx_var";
                                    b.className = "cx_var cx_on";
                                    cx_play(card, method, vi);
                                };
                                btns.appendChild(b);
                            })(v);
                        }
                        var rp = document.createElement("button");
                        rp.className = "cx_replay";
                        rp.textContent = "▶ 重播";
                        rp.onclick = function () { cx_play(card, method, cx_current(card, method)); };
                        btns.appendChild(rp);
                    })(method, card);

                    grid.appendChild(card);
                    cx_cards.push({ card: card, method: method });
                }

                sec.appendChild(grid);
                host.appendChild(sec);
            }
        }

        function cx_current(card, method) {
            var all = card.querySelectorAll(".cx_var");
            for (var i = 0; i < all.length; i++) {
                if (all[i].className.indexOf("cx_on") >= 0) return i;
            }
            return 0;
        }

        // 全部播放（带级联延迟）
        var cx_timers = [];
        function cx_playAll() {
            for (var t = 0; t < cx_timers.length; t++) clearTimeout(cx_timers[t]);
            cx_timers = [];
            for (var i = 0; i < cx_cards.length; i++) {
                (function (item, idx) {
                    cx_timers.push(setTimeout(function () {
                        cx_play(item.card, item.method, cx_current(item.card, item.method));
                    }, idx * 90));
                })(cx_cards[i], i);
            }
        }

        function cx_buildTable() {
            var tb = document.getElementById("cx_tableBody");
            var html = "";
            for (var i = 0; i < cx_tableData.length; i++) {
                var row = cx_tableData[i];
                html += "<tr><td><code>" + row[0] + "</code></td><td>" + row[1] +
                    "</td><td style='color:" + (row[2] === "是" ? "#c7254e" : "#1e4b3b") + ";font-weight:" +
                    (row[2] === "是" ? "bold" : "normal") + "'>" + row[2] +
                    "</td><td>" + row[3] + "</td></tr>";
            }
            tb.innerHTML = html;
        }

        /* ---------- 输入解析 ---------- */
        function cx_parse(str) {
            var parts = str.split(",");
            var out = [];
            for (var i = 0; i < parts.length; i++) {
                var s = parts[i].trim();
                if (s === "") continue;
                s = s.replace(/^['"]|['"]$/g, "");
                var n = Number(s);
                out.push(s !== "" && !isNaN(n) ? n : s);
            }
            return out;
        }

        /* ---------- 事件绑定 ---------- */
        document.getElementById("cx_apply").onclick = function () {
            var arr = cx_parse(document.getElementById("cx_input").value);
            if (arr.length === 0) {
                alert("请输入至少一个元素，例如：5, 2, 9, 1, 7, 4");
                return;
            }
            cx_main = arr;
            cx_renderBoard();
            cx_playAll();
        };

        document.getElementById("cx_reset").onclick = function () {
            cx_main = CX_DEFAULT.slice();
            document.getElementById("cx_input").value = CX_DEFAULT.join(", ");
            cx_renderBoard();
            cx_playAll();
        };

        document.getElementById("cx_replayAll").onclick = function () {
            cx_renderBoard();
            cx_playAll();
        };

        /* ---------- 启动 ---------- */
        cx_renderBoard();
        cx_build();
        cx_buildTable();
        cx_playAll();

        console.log("===== 陈曦 · 16-1 数组方法图解 =====");
        console.log("当前演示数组：", cx_main);
    </script>
</body>
</html>
