<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10-2 幻灯片</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.12), transparent 42%),
        linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    .slider {
      position: relative;
      width: 720px;
      max-width: 90vw;
      height: 520px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        inset 0 0 0 1px rgba(255,255,255,0.06);
      overflow: hidden;
      border-radius: 18px;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      animation: fade 9s infinite;
      background: #000;
    }

    .slide:nth-child(1) { animation-delay: 0s; }
    .slide:nth-child(2) { animation-delay: 3s; }
    .slide:nth-child(3) { animation-delay: 6s; }

    .slide img {
      display: block;
      width: 100%;
      height: 420px;
      object-fit: cover;
      filter: contrast(1.08) saturate(1.15) brightness(0.95);
      transform: scale(1.02);
    }

    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0.1) 35%, rgba(0,0,0,0.25));
      pointer-events: none;
    }

    .slide .name {
      position: absolute;
      left: 26px;
      bottom: 88px;
      z-index: 2;
      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 4px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      backdrop-filter: blur(3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.18);
    }

    .slide .info {
      position: relative;
      z-index: 2;
      padding: 18px 22px 22px;
      background: #000;
      color: #fff;
      font-size: 18px;
      letter-spacing: 2px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-shadow: 0 1px 6px rgba(255,255,255,0.08);
    }

    @keyframes fade {
      0%, 26% {
        opacity: 1;
      }
      33%, 100% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .slide img {
        height: 300px;
      }

      .slide .name {
        left: 16px;
        bottom: 72px;
        font-size: 24px;
        letter-spacing: 2px;
      }

      .slide .info {
        font-size: 15px;
        letter-spacing: 1px;
      }
    }
  </style>
</head>
<body>
  <div class="slider">
    <div class="slide">
      <img src="img/1.jpg" alt="陈曦 1" />
      <div class="name">陈曦</div>
      <div class="info">梦想起航 · 影像故事</div>
    </div>

    <div class="slide">
      <img src="img/2.jpg" alt="陈曦 2" />
      <div class="name">陈曦</div>
      <div class="info">色彩流动 · 光影交织</div>
    </div>

    <div class="slide">
      <img src="img/3.jpg" alt="陈曦 3" />
      <div class="name">陈曦</div>
      <div class="info">前行风景 · 逐梦青春</div>
    </div>
  </div>
</body>
</html>
